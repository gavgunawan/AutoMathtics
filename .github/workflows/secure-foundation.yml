name: AutoMathtics v3.0 checks
on:
  pull_request:
    paths: ['commercial/**', '.github/workflows/secure-foundation.yml']
  push:
    branches: ['main', 'release/v3.0', 'hardening/*', 'feature/*']
    paths: ['commercial/**', '.github/workflows/secure-foundation.yml']
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commercial
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm test
      # production dependencies only, straight from the committed lockfile (no install needed): a high or critical
      # advisory fails the build. The moderate ones accepted on 9 Sep 2026 are recorded in commercial/DEPLOY_V3.md § 3.
      - run: npm audit --omit=dev --audit-level=high
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: commercial
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned dependencies
        # never `npm install` here: without a lockfile this job would resolve and test a dependency tree that is not the
        # one that deploys, and it used to say so only in a warning nobody reads (commercial/DEPLOY_V3.md § 3)
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is missing: generate it with npm install --ignore-scripts on your own machine, review and commit it."
            exit 1
          fi
          npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run test:emulator
        env:
          CI: 'true'
          FIREBASE_CLI_DISABLE_USAGE: 'true'
  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build runtime image without deploying or publishing it
        run: docker build --tag automathtics-stage1-check ./commercial
