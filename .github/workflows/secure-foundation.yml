name: AutoMathtics v3.0 checks
on:
  pull_request:
    paths: ['commercial/**', '.github/workflows/secure-foundation.yml']
  push:
    branches: ['main', 'release/v3.0', 'hardening/stage-1', 'feature/secure-foundation-step-1']
    paths: ['commercial/**', '.github/workflows/secure-foundation.yml']
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commercial
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm test
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: commercial
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-fund --no-audit
          else
            echo "::warning::Generate, review and commit package-lock.json before deploying."
            npm install --ignore-scripts --no-fund --no-audit
          fi
      - run: npm run test:emulator
        env:
          CI: 'true'
          FIREBASE_CLI_DISABLE_USAGE: 'true'
  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build runtime image without deploying or publishing it
        run: docker build --tag automathtics-stage1-check ./commercial
