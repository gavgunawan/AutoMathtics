<style>
:root{
  --void:#0B0E23; --deep:#07091A;
  --line:#2A3170; --line2:#3A4490;
  --cyan:#35E0FF; --magenta:#FF2DA8; --violet:#8A5CFF;
  --gold:#FFB020; --green:#2DFFB3; --red:#FF3B5C;
  --txt:#EAF2FF; --dim:#8A93C9;
  --head:'Orbitron','Rajdhani',sans-serif;
  --body:'Rajdhani','Trebuchet MS',Verdana,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --card:linear-gradient(155deg, rgba(16,20,46,.96), rgba(10,13,34,.94));
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--deep)}
body{
  min-height:100vh; color:var(--txt); font-family:var(--body); font-size:16px; line-height:1.45;
  background:
    radial-gradient(circle at 16% 12%, rgba(255,45,168,.16), transparent 29%),
    radial-gradient(circle at 84% 18%, rgba(53,224,255,.14), transparent 31%),
    radial-gradient(circle at 52% 96%, rgba(138,92,255,.12), transparent 35%),
    linear-gradient(145deg,#07091A 0%,#0B0E23 48%,#080A1C 100%);
  background-attachment:fixed;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  overflow-x:hidden; -webkit-text-size-adjust:100%;
}
h1,h2,h3{margin:0;font-family:var(--head);letter-spacing:.04em;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.wrap{max-width:660px;margin:0 auto;padding:16px}

/* ---------------- PIN gate ---------------- */
#gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.gatecard{
  background:var(--card); border:1px solid var(--line); border-radius:22px;
  padding:34px 26px; width:100%; max-width:360px; text-align:center;
  box-shadow:0 22px 70px rgba(0,0,0,.5), 0 0 40px rgba(53,224,255,.08), inset 0 1px 0 rgba(255,255,255,.04);
}
.kicker{font-family:var(--head);font-size:10px;letter-spacing:.22em;color:var(--dim);font-weight:700}
.gatecard h1{font-size:19px;color:var(--cyan);margin:6px 0 2px}
.gatesub{font-size:13.5px;color:var(--dim);margin-bottom:20px}
.dots{display:flex;gap:11px;justify-content:center;margin:4px 0 16px}
.dots i{
  width:16px;height:16px;border-radius:50%;border:2px solid var(--cyan);
  background:transparent;transition:background .12s, box-shadow .12s;
}
.dots i.on{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.dots.err i{border-color:var(--red)} .dots.err i.on{background:var(--red);box-shadow:0 0 10px var(--red)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:6px}
.pad button{
  background:var(--void); border:1.5px solid var(--line); border-radius:12px;
  padding:14px 0; font-family:var(--mono); font-size:20px; font-weight:600; color:var(--txt);
}
.pad button:active{background:#141A45;border-color:var(--cyan)}
.pad .wide{grid-column:span 1;font-size:15px;color:var(--dim);font-family:var(--body)}
.gatemsg{min-height:22px;margin-top:12px;font-size:13px;font-weight:700;color:var(--red)}

/* ---------------- header ---------------- */
.top{
  position:sticky; top:0; z-index:30; backdrop-filter:blur(14px);
  background:linear-gradient(180deg, rgba(7,9,26,.96), rgba(7,9,26,.82));
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0);
}
.topin{max-width:660px;margin:0 auto;padding:12px 16px 11px}
.brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brandrow h1{font-size:17px;color:var(--cyan)}
.dateline{font-family:var(--head);font-size:12.5px;font-weight:600;color:var(--txt);margin-top:3px}
.clock{font-family:var(--mono);font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.lockin{font-family:var(--mono);font-size:11px;color:var(--gold)}

/* progress meter */
.meter{margin-top:10px;position:relative;height:16px;border-radius:999px;background:#10143A;border:1px solid var(--line);overflow:hidden}
.meter i{
  display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--violet),var(--cyan) 55%,var(--green));
  box-shadow:0 0 18px rgba(53,224,255,.55); transition:width .45s cubic-bezier(.2,.8,.2,1);
}
.meter b{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--txt);
  text-shadow:0 1px 3px rgba(4,6,26,.95), 0 0 6px rgba(4,6,26,.8);letter-spacing:.04em;
}
.metarow{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.metarow b{color:var(--txt);font-weight:700}

/* streak + bonus */
.rewards{display:flex;gap:10px;margin-top:11px;flex-wrap:wrap}
.pill{
  flex:1 1 150px; background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:9px 12px; min-width:0;
}
.pill.hot{border-color:var(--gold);box-shadow:0 0 22px rgba(255,176,32,.2)}
.pill .lab{font-family:var(--head);font-size:9px;letter-spacing:.16em;color:var(--dim);font-weight:700}
.pill .val{font-family:var(--head);font-size:17px;font-weight:800;color:var(--gold);margin-top:2px}
.pill .note{font-size:11.5px;color:var(--dim);margin-top:1px;line-height:1.3}
.segs{display:flex;gap:3px;margin-top:6px}
.segs i{flex:1;height:5px;border-radius:2px;background:#1A1F4D}
.segs i.on{background:var(--green);box-shadow:0 0 7px rgba(45,255,179,.6)}
.segs i.brk{background:var(--red)}

/* ---------------- cards ---------------- */
.sec{font-family:var(--head);font-size:10.5px;letter-spacing:.18em;color:var(--dim);font-weight:700;margin:22px 0 9px}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  margin-bottom:11px; overflow:hidden;
  box-shadow:0 14px 44px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.035);
}
.card.done{border-color:rgba(45,255,179,.4)}
.chead{display:flex;align-items:flex-start;gap:11px;padding:13px 15px 0}
.tmark{
  font-family:var(--mono);font-size:13px;font-weight:700;color:var(--cyan);
  background:#10143A;border:1px solid var(--line);border-radius:8px;padding:4px 8px;
  flex:none;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.tmark.rnd{color:var(--magenta);border-color:rgba(255,45,168,.45)}
.ctitle{flex:1;min-width:0}
.ctitle h3{font-size:15.5px;color:var(--txt);letter-spacing:.01em}
.ctitle p{margin:2px 0 0;font-size:13px;color:var(--dim)}
.rows{padding:10px 15px 14px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(42,49,112,.55)}
.row:last-child{border-bottom:0;padding-bottom:0}
.tick{
  width:30px;height:30px;flex:none;border-radius:9px;border:2px solid var(--line2);
  background:#0D1233;display:grid;place-items:center;font-size:15px;line-height:1;color:transparent;
  transition:background .14s,border-color .14s,box-shadow .14s;
}
.tick[aria-checked="true"]{background:var(--green);border-color:var(--green);color:#042016;box-shadow:0 0 16px rgba(45,255,179,.5)}
.tick:disabled{opacity:.4;cursor:not-allowed}
.rlab{font-size:14.5px;font-weight:600}
.rlab small{display:block;font-weight:500;font-size:12px;color:var(--dim)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.chip{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:999px;background:#10143A;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.chip.ok{color:var(--green);border-color:rgba(45,255,179,.45)}
.chip.warn{color:var(--gold);border-color:rgba(255,176,32,.45)}
.chip.bad{color:var(--red);border-color:rgba(255,59,92,.45)}
.chip.acc{color:var(--cyan);border-color:rgba(53,224,255,.45)}
.act{display:flex;align-items:center;gap:7px;flex:none}
.thumbs{display:flex;gap:5px}
.thumb{width:34px;height:34px;border-radius:7px;overflow:hidden;border:1px solid var(--line2);background:#10143A;padding:0;display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.btn{background:var(--void);color:var(--cyan);border:1.5px solid var(--cyan);border-radius:10px;padding:6px 11px;font-family:var(--head);font-size:11px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.btn:active{background:#141A45}
.btn.mute{color:var(--dim);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.note{grid-column:1/-1;margin-top:6px;width:100%;background:#0D1233;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:13.5px;color:var(--txt);resize:vertical;min-height:40px}
.mine{margin-top:11px;padding-left:10px;border-left:2px solid var(--violet);font-size:12px;color:var(--dim);line-height:1.45}
.mine b{font-family:var(--head);font-size:9.5px;letter-spacing:.14em;color:var(--violet)}

/* auto section */
.autocard{background:var(--card);border:1px dashed var(--line2);border-radius:16px;padding:13px 15px;margin-bottom:11px}
.autocard h3{font-size:14.5px;color:var(--cyan)}
.autocard p{margin:4px 0 0;font-size:12.5px;color:var(--dim)}

/* history */
.hgrid{display:flex;gap:5px;flex-wrap:wrap}
.hcell{width:40px;border:1px solid var(--line);border-radius:9px;background:#0D1233;padding:6px 0 5px;text-align:center}
.hcell.cur{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
.hcell .hd{font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.hcell .hn{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--txt);font-variant-numeric:tabular-nums}
.hcell .hb{height:4px;border-radius:2px;margin:4px 5px 0;background:#1A1F4D}

.banner{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:12px;padding:11px 14px;margin-bottom:14px;font-size:13.5px;color:var(--dim)}
.banner b{color:var(--txt)}

/* burst overlay */
#burst{position:fixed;inset:0;pointer-events:none;z-index:80}
#burst span{position:absolute;font-size:24px;will-change:transform,opacity}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
#toast{
  position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  z-index:85;background:var(--void);border:1.5px solid var(--gold);border-radius:14px;
  padding:11px 18px;font-family:var(--head);font-size:13px;font-weight:700;color:var(--gold);
  box-shadow:0 0 30px rgba(255,176,32,.35);max-width:90vw;text-align:center;
}
#lightbox{position:fixed;inset:0;z-index:90;background:rgba(4,6,20,.92);display:grid;place-items:center;padding:20px}
#lightbox img{max-width:100%;max-height:82vh;border-radius:10px;display:block}
#lbmeta{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:10px;text-align:center;max-width:560px}
@media (max-width:460px){
  .row{grid-template-columns:auto 1fr}
  .act{grid-column:2;justify-content:flex-start;margin-top:3px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="app" hidden>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, setPersistence, browserLocalPersistence, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getDatabase, ref as dref, get as dget, update as dupdate, onValue, query, orderByKey, limitToLast }
  from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
import { getStorage, ref as sref, uploadBytes, getDownloadURL }
  from "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";

/* Sama dengan konfigurasi yang dipakai game — proyek Firebase-nya satu. */
const FB = {
  apiKey: "AIzaSyBED-NDwWrpPZRVZgu1QkIxJIS1wr4GpxA",
  authDomain: "automathtics.firebaseapp.com",
  databaseURL: "https://automathtics-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "automathtics",
  storageBucket: "automathtics.firebasestorage.app",
  messagingSenderId: "960131323657",
  appId: "1:960131323657:web:d2bb30c8ac9b5e8c6265d8"
};
/* PIN-nya BUKAN disimpan di halaman ini. PIN yang diketik dipakai sebagai password
   Firebase untuk akun di bawah, jadi PIN salah = tidak dapat token = tidak dapat data
   sama sekali. Mengintip source halaman tidak memberi apa pun. */
const ACCOUNT = "pa-naurah@automathtics.app";
const ROOT = "pa/naurah";

const app = initializeApp(FB);
const auth = getAuth(app), db = getDatabase(app), store = getStorage(app);

/* ============================ waktu WIB ============================ */
const WIB = 7 * 3600 * 1000;
const wib = t => new Date((t == null ? Date.now() : t) + WIB);
const keyOf = d => d.toISOString().slice(0, 10);
const todayKey = () => keyOf(wib());
const pad = n => String(n).padStart(2, "0");
const nowMins = () => { const d = wib(); return d.getUTCHours() * 60 + d.getUTCMinutes(); };
const minsOf = ms => { const d = wib(ms); return d.getUTCHours() * 60 + d.getUTCMinutes(); };
const toMin = s => { const p = s.split(":"); return (+p[0]) * 60 + (+p[1]); };
const clockOf = ms => pad(wib(ms).getUTCHours()) + ":" + pad(wib(ms).getUTCMinutes());
const dayOfMs = ms => keyOf(wib(ms));
const HARI = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const HARI3 = ["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
const BLN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const dtOf = k => { const p = k.split("-").map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); };
const longDate = k => { const p = k.split("-").map(Number); return HARI[dtOf(k).getUTCDay()] + ", " + p[2] + " " + BLN[p[1] - 1] + " " + p[0]; };
const shiftKey = (k, n) => { const d = dtOf(k); d.setUTCDate(d.getUTCDate() + n); return keyOf(d); };
const durTxt = ms => { const m = Math.max(0, Math.floor(ms / 60000)); return Math.floor(m / 60) + "j " + pad(m % 60) + "m"; };

/* ======================= suara arcade (WebAudio) ======================= */
let actx = null;
function ac() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  } catch (e) { return null; }
}
function tone(freq, at, dur, type, vol) {
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, c.currentTime + at);
  g.gain.setValueAtTime(0.0001, c.currentTime + at);
  g.gain.exponentialRampToValueAtTime(vol, c.currentTime + at + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + at + dur);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime + at); o.stop(c.currentTime + at + dur + 0.05);
}
// ka-ching: dua lonceng tinggi beruntun plus kilau di atasnya
function playCoin() {
  tone(1244.5, 0,     0.11, "triangle", 0.22);
  tone(1864.7, 0.055, 0.20, "triangle", 0.20);
  tone(2489.0, 0.075, 0.26, "sine",     0.09);
  tone(932.3,  0.045, 0.16, "sine",     0.07);
}
function playJackpot() {
  [523.3, 659.3, 784.0, 1046.5, 1318.5, 1568.0].forEach((f, i) => tone(f, i * 0.075, 0.30, "triangle", 0.20));
  tone(2093, 0.50, 0.55, "sine", 0.13);
}
function playThud() { tone(160, 0, 0.16, "sine", 0.16); }

function burst(x, y, big) {
  const box = document.getElementById("burst"), chars = big ? ["💰","🪙","✨","💵","⭐"] : ["🪙","✨","🪙"];
  for (let i = 0; i < (big ? 22 : 8); i++) {
    const s = document.createElement("span");
    s.textContent = chars[i % chars.length];
    s.style.left = x + "px"; s.style.top = y + "px";
    s.style.setProperty("--dx", (Math.random() * 240 - 120) + "px");
    s.style.setProperty("--dy", (-120 - Math.random() * 220) + "px");
    s.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
    s.style.animation = "fly " + (0.75 + Math.random() * 0.5) + "s cubic-bezier(.15,.7,.3,1) forwards";
    box.appendChild(s);
    setTimeout(() => s.remove(), 1400);
  }
}
let toastT = null;
function toast(msg, ms) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, ms || 3200);
}

/* ============================== tugas ============================== */
const HOTELS = [
  { id: "oaktree", label: "OAK Tree Urban" },
  { id: "cirebon", label: "Verse Cirebon" },
  { id: "lite",    label: "Verse Lite" },
  { id: "luxe",    label: "Verse Luxe" }
];
const BANDS = [[420, 630], [630, 870], [870, 1110], [1110, 1320]];
function hash32(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const _calls = {};
function callTimes(k) {
  if (_calls[k]) return _calls[k];
  const order = HOTELS.map(h => h.id);
  let h = hash32("band|" + k);
  for (let i = order.length - 1; i > 0; i--) { h = hash32(String(h)); const j = h % (i + 1), t = order[i]; order[i] = order[j]; order[j] = t; }
  const out = {};
  order.forEach((id, i) => { const b = BANDS[i], m = b[0] + hash32("jam|" + k + "|" + id) % (b[1] - b[0]); out[id] = pad(Math.floor(m / 60)) + ":" + pad(m % 60); });
  return (_calls[k] = out);
}

async function sha256(buf) {
  const d = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2, "0")).join("");
}
const POP = n => { let c = 0; while (n) { c += n & 1; n >>= 1; } return c; };
function hamming(a, b) { if (!a || !b || a.length !== b.length) return 64; let d = 0; for (let i = 0; i < a.length; i++) d += POP(parseInt(a[i], 16) ^ parseInt(b[i], 16)); return d; }
async function fingerprint(file) {
  const bmp = await createImageBitmap(file), W = 9, H = 8, w0 = bmp.width, h0 = bmp.height;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(bmp, 0, 0, W, H);
  const d = ctx.getImageData(0, 0, W, H).data;
  let bits = "";
  for (let y = 0; y < H; y++) for (let x = 0; x < W - 1; x++) {
    const i = (y * W + x) * 4, j = (y * W + x + 1) * 4;
    const a = .299 * d[i] + .587 * d[i + 1] + .114 * d[i + 2];
    const b = .299 * d[j] + .587 * d[j + 1] + .114 * d[j + 2];
    bits += a > b ? "1" : "0";
  }
  let hex = ""; for (let k = 0; k < 64; k += 4) hex += parseInt(bits.slice(k, k + 4), 2).toString(16);
  const MAX = 1600, sc = Math.min(1, MAX / Math.max(w0, h0));
  const c2 = document.createElement("canvas");
  c2.width = Math.max(1, Math.round(w0 * sc)); c2.height = Math.max(1, Math.round(h0 * sc));
  c2.getContext("2d").drawImage(bmp, 0, 0, c2.width, c2.height);
  if (bmp.close) bmp.close();
  const blob = await new Promise(r => c2.toBlob(r, "image/jpeg", .8));
  return { hex, w: w0, h: h0, blob };
}
function nearestHash(hex) {
  let best = null;
  for (const sha in S.hashes) { const e = S.hashes[sha], d = hamming(hex, e.p); if (!best || d < best.d) best = { d, day: e.d }; }
  return best;
}

async function onPick(task, tgt, file) {
  const k = keyFor(task, tgt);
  if (S.busy[k]) return;
  S.busy[k] = "Memproses…"; render();
  try {
    if (file.size > 25 * 1024 * 1024) throw new Error("File terlalu besar (maks 25 MB).");
    const sha = (await sha256(await file.arrayBuffer())).slice(0, 24);
    if (S.hashes[sha]) throw new Error("Screenshot ini sudah pernah dipakai (" + longDate(S.hashes[sha].d) + "). Ambil screenshot baru.");
    let fp;
    try { fp = await fingerprint(file); } catch (_) { throw new Error("Gambar tidak terbaca. Pakai PNG atau JPG."); }
    const flags = [];
    const near = nearestHash(fp.hex);
    if (near && near.d <= 5 && near.day !== S.dayKey) flags.push("mirip:" + near.day);
    if (file.lastModified && dayOfMs(file.lastModified) !== S.dayKey) flags.push("file:" + dayOfMs(file.lastModified));

    S.busy[k] = "Mengunggah…"; render();
    const id = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const dest = sref(store, ROOT + "/" + S.dayKey + "/" + k + "/" + id + ".jpg");
    await uploadBytes(dest, fp.blob, { contentType: "image/jpeg" });
    const url = await getDownloadURL(dest);

    await addProof(k, { id, url, name: String(file.name || "bukti").slice(0, 80), w: fp.w, h: fp.h,
                        sha, ph: fp.hex, fmod: file.lastModified || 0, at: Date.now(), flags });
    await recordHash(sha, fp.hex, k);
    S.busy[k] = null; render();
  } catch (e) {
    S.busy[k] = null;
    playThud();
    alert(e && e.code === "storage/unauthorized"
      ? "Akun ini belum diizinkan mengunggah. Hubungi owner."
      : (e && e.message) || "Gagal mengunggah bukti.");
    render();
  }
}

const hasProof = r => proofsOf(r).length > 0;
function blocked(task, tgt, r) {
  if (!hasProof(r)) return "bukti";
  if (task.retry && r.noanswer && proofsOf(r).length < 2) return "dua";
  if (task.noteRequired && !(r.note || "").trim()) return "catatan";
  return null;
}
function lateOf(task, tgt, r) {
  return (r.done && r.at != null) ? Math.max(0, minsOf(r.at) - toMin(atOf(task, tgt))) : 0;
}
function statsFor(key) {
  const items = (S.days[key] || {}).items || {};
  let done = 0, late = 0, flag = 0;
  HER.forEach(t => reqTargets(t).forEach(g => {
    const r = items[keyFor(t, g)] || {};
    if (!r.done) return;
    done++;
    if (proofsOf(r).some(p => (p.flags || []).length)) flag++;
    else if (r.at != null && minsOf(r.at) > toMin(g.at || t.due)) late++;
  }));
  return { done, late, flag, total: TOTAL, perfect: done >= TOTAL };
}
function streakRun() {
  let run = 0, k = S.dayKey;
  if (!statsFor(k).perfect) k = shiftKey(k, -1);
  while (S.days[k] && statsFor(k).perfect) { run++; k = shiftKey(k, -1); }
  return run;
}
function weekCount(task) {
  const dow = (dtOf(S.dayKey).getUTCDay() + 6) % 7;
  let n = 0;
  for (let i = 0; i <= dow; i++) {
    const day = S.days[shiftKey(S.dayKey, -i)]; if (!day) continue;
    task.targets.forEach(g => { if (((day.items || {})[keyFor(task, g)] || {}).done) n++; });
  }
  return n;
}

  $("gate").hidden = true; $("app").hidden = false;
  tickClock(); setInterval(tickClock, 1000);
  setInterval(() => { const t = todayKey(); if (t !== S.dayKey) { S.dayKey = t; S.hashes = {}; S.prevDone = -1; loadHashes().then(render); render(); } }, 15000);
  loadHashes();
  onValue(query(dref(db, ROOT + "/days"), orderByKey(), limitToLast(21)), snap => {
    S.days = snap.val() || {};
    render();
    S.ready = true;
  }, err => {
    $("banner").hidden = false;
    $("banner").textContent = "Data tidak bisa dimuat: " + (err && err.message ? err.message : "cek koneksi") + ". Muat ulang halaman.";
  });
}

/* --------------------------- gerbang PIN --------------------------- */
let pin = "", busyPin = false;
const dots = () => $("dots").querySelectorAll("i");
function drawPin(err) {
  $("dots").className = "dots" + (err ? " err" : "");
  dots().forEach((d, i) => { d.className = i < pin.length ? "on" : ""; });
}
async function submitPin() {
  if (busyPin) return;
  busyPin = true; $("gatemsg").textContent = "";
  try {
    await setPersistence(auth, browserLocalPersistence);
    await signInWithEmailAndPassword(auth, ACCOUNT, pin);
    playCoin();
  } catch (e) {
    busyPin = false; playThud();
    pin = ""; drawPin(true);
    const code = e && e.code || "";
    $("gatemsg").textContent =
      code === "auth/too-many-requests" ? "Terlalu banyak percobaan. Tunggu beberapa menit." :
      code === "auth/network-request-failed" ? "Tidak ada koneksi internet." :
      code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found" ? "✗ PIN salah" :
      "Gagal masuk (" + (code || "error") + ")";
    setTimeout(() => drawPin(false), 900);
    return;
  }
  busyPin = false;
}
(function buildPad() {
  const p = $("pad");
  ["1","2","3","4","5","6","7","8","9","hapus","0","ok"].forEach(key => {
    const b = el("button", key === "hapus" || key === "ok" ? "wide" : "", key === "hapus" ? "⌫" : key === "ok" ? "OK" : key);
    b.onclick = () => {
      ac();
      if (key === "hapus") { pin = pin.slice(0, -1); drawPin(false); return; }
      if (key === "ok") { if (pin.length === 6) submitPin(); return; }
      if (pin.length < 6) { pin += key; drawPin(false); tone(660 + pin.length * 40, 0, .05, "triangle", .07); }
      if (pin.length === 6) submitPin();
    };
    p.appendChild(b);
  });
  drawPin(false);
})();
addEventListener("keydown", e => {
  if (!$("gate").hidden) {
    if (/^[0-9]$/.test(e.key) && pin.length < 6) { pin += e.key; drawPin(false); if (pin.length === 6) submitPin(); }
    else if (e.key === "Backspace") { pin = pin.slice(0, -1); drawPin(false); }
  }
  if (e.key === "Escape") $("lightbox").hidden = true;
});
onAuthStateChanged(auth, u => { if (u && $("app").hidden) startApp(); });
</script>
