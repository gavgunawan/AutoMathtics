<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --ground:#F3F6F5; --surface:#FFFFFF; --surface2:#F7FAF9;
  --ink:#16201E; --ink2:#38443F; --muted:#63706C; --faint:#8C9995;
  --line:#DCE4E1; --line2:#C7D2CE;
  --accent:#0B6E62; --accent-soft:#E2F1EE; --accent-ink:#064E45;
  --ok:#186F3C; --ok-soft:#E3F2E7;
  --warn:#8E5B00; --warn-soft:#FAEFD9;
  --bad:#A8272A; --bad-soft:#FBE5E4;
  --review:#5F45A0; --review-soft:#EEE9FA;
  --shadow:0 1px 2px rgba(16,32,28,.05), 0 6px 18px -12px rgba(16,32,28,.22);
  --radius:12px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#101413; --surface:#181E1C; --surface2:#1E2624;
    --ink:#E9EFED; --ink2:#C3CECA; --muted:#93A09C; --faint:#75837F;
    --line:#293230; --line2:#36423F;
    --accent:#4FD1BD; --accent-soft:#12312D; --accent-ink:#8FE6D8;
    --ok:#5FD98A; --ok-soft:#12301E;
    --warn:#E5AC55; --warn-soft:#33260F;
    --bad:#F58279; --bad-soft:#38191A;
    --review:#B7A0F0; --review-soft:#241C3A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#101413; --surface:#181E1C; --surface2:#1E2624;
  --ink:#E9EFED; --ink2:#C3CECA; --muted:#93A09C; --faint:#75837F;
  --line:#293230; --line2:#36423F;
  --accent:#4FD1BD; --accent-soft:#12312D; --accent-ink:#8FE6D8;
  --ok:#5FD98A; --ok-soft:#12301E;
  --warn:#E5AC55; --warn-soft:#33260F;
  --bad:#F58279; --bad-soft:#38191A;
  --review:#B7A0F0; --review-soft:#241C3A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  font-feature-settings:"cv05" 1;
}
h1,h2,h3{margin:0; text-wrap:balance}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}

/* ---------- masthead ---------- */
.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topin{max-width:920px; margin:0 auto; padding:12px 16px 0}
.brandrow{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.brand{
  font-family:var(--cond); font-weight:700; font-size:21px; letter-spacing:.01em;
}
.brand span{color:var(--accent)}
.eyebrow{
  font-family:var(--cond); font-weight:600; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--faint);
}
.daterow{display:flex; align-items:baseline; gap:10px 16px; flex-wrap:wrap; margin-top:6px}
.dateline{font-family:var(--cond); font-weight:600; font-size:17px}
.clock{font-family:var(--mono); font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.lockin{
  font-family:var(--mono); font-size:11.5px; color:var(--warn);
  background:var(--warn-soft); padding:2px 8px; border-radius:999px;
  font-variant-numeric:tabular-nums;
}
.daybar{display:flex; height:7px; border-radius:999px; overflow:hidden; background:var(--line); margin:11px 0 8px}
.daybar i{display:block; height:100%}
.seg-ok{background:var(--ok)} .seg-late{background:var(--warn)} .seg-flag{background:var(--bad)}
.tallies{
  display:flex; gap:6px 14px; flex-wrap:wrap; padding-bottom:11px;
  font-family:var(--mono); font-size:11.5px; color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.tallies b{font-weight:600; color:var(--ink)}
.dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; vertical-align:middle}

/* ---------- layout ---------- */
.wrap{max-width:920px; margin:0 auto; padding:18px 16px 64px}
section{margin-bottom:26px}
.sechead{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px; flex-wrap:wrap}
.sechead h2{font-family:var(--cond); font-size:13px; letter-spacing:.13em; text-transform:uppercase; color:var(--faint); font-weight:600}

/* ---------- banners ---------- */
.banner{
  border:1px solid var(--line); border-left:3px solid var(--warn);
  background:var(--surface); border-radius:var(--radius);
  padding:11px 14px; margin-bottom:16px; font-size:13.5px; color:var(--ink2);
}
.banner.locked{border-left-color:var(--review); background:var(--review-soft)}
.banner strong{color:var(--ink)}

/* ---------- task card ---------- */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden;
}
.cardin{display:grid; grid-template-columns:78px 1fr; gap:0}
.rail{
  border-right:1px solid var(--line); background:var(--surface2);
  padding:14px 10px; text-align:center;
}
.rail .t{font-family:var(--mono); font-weight:600; font-size:15px; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.rail .z{font-family:var(--mono); font-size:9.5px; color:var(--faint); letter-spacing:.1em; margin-top:1px}
.rail .cad{font-family:var(--mono); font-size:9.5px; color:var(--accent); margin-top:6px; line-height:1.3}
.body{padding:13px 15px 14px; min-width:0}
.titlerow{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; flex-wrap:wrap}
.tname{font-weight:600; font-size:15.5px; letter-spacing:-.005em}
.tsub{color:var(--muted); font-size:13px; margin-top:2px}
.badge{
  font-family:var(--cond); font-size:10px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; padding:3px 7px; border-radius:5px; white-space:nowrap;
}
.b-auto{background:var(--ok-soft); color:var(--ok)}
.b-ai{background:var(--accent-soft); color:var(--accent-ink)}
.b-manual{background:var(--review-soft); color:var(--review)}

/* target rows */
.rows{margin-top:11px; border-top:1px solid var(--line)}
.trow{
  display:grid; grid-template-columns:auto 1fr auto; gap:10px;
  align-items:center; padding:9px 0; border-bottom:1px dashed var(--line);
}
.trow:last-child{border-bottom:0; padding-bottom:0}
.tick{
  width:26px; height:26px; flex:none; border-radius:7px; cursor:pointer;
  border:1.5px solid var(--line2); background:var(--surface);
  display:grid; place-items:center; font-size:14px; line-height:1;
  color:transparent; transition:background .12s, border-color .12s;
}
.tick[aria-checked="true"]{background:var(--ok); border-color:var(--ok); color:#fff}
.tick:disabled{cursor:not-allowed; opacity:.45}
.tmain{min-width:0}
.tlabel{font-size:14px; font-weight:500}
.tlabel small{display:block; font-weight:400; color:var(--faint); font-size:12px}
.chips{display:flex; gap:5px; flex-wrap:wrap; margin-top:5px}
.chip{
  font-family:var(--mono); font-size:10.5px; padding:2px 7px; border-radius:999px;
  background:var(--surface2); color:var(--muted); border:1px solid var(--line);
  white-space:nowrap;
}
.chip.ok{background:var(--ok-soft); color:var(--ok); border-color:transparent}
.chip.warn{background:var(--warn-soft); color:var(--warn); border-color:transparent}
.chip.bad{background:var(--bad-soft); color:var(--bad); border-color:transparent}
.chip.rev{background:var(--review-soft); color:var(--review); border-color:transparent}
.chip.acc{background:var(--accent-soft); color:var(--accent-ink); border-color:transparent}
.tact{display:flex; align-items:center; gap:7px; flex:none}
.thumbs{display:flex; gap:5px}
.thumb{
  width:34px; height:34px; border-radius:6px; overflow:hidden; border:1px solid var(--line2);
  background:var(--surface2); cursor:zoom-in; padding:0; display:block;
}
.thumb img{width:100%; height:100%; object-fit:cover; display:block}
.btn{
  border:1px solid var(--line2); background:var(--surface); border-radius:8px;
  padding:5px 10px; font-size:12.5px; font-weight:500; cursor:pointer; white-space:nowrap;
}
.btn:hover:not(:disabled){border-color:var(--accent); color:var(--accent-ink)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover:not(:disabled){filter:brightness(1.08); color:#fff}
.btn.tiny{padding:3px 8px; font-size:11.5px}
.verdict{
  grid-column:1/-1; margin:2px 0 0 36px; font-size:12.5px; color:var(--muted);
  border-left:2px solid var(--line2); padding-left:9px;
}
.verdict.bad{border-left-color:var(--bad)} .verdict.warn{border-left-color:var(--warn)}
.verdict.ok{border-left-color:var(--ok)}
.notefield{
  grid-column:1/-1; margin:6px 0 0 36px; width:calc(100% - 36px);
  border:1px solid var(--line); background:var(--surface2); border-radius:8px;
  padding:7px 9px; font:inherit; font-size:13px; color:var(--ink); resize:vertical; min-height:38px;
}
.mycheck{
  margin-top:12px; padding-left:10px; border-left:2px solid var(--review);
  font-size:12.5px; color:var(--muted); line-height:1.45;
}
.mycheck b{font-family:var(--cond); letter-spacing:.06em; text-transform:uppercase; font-size:10.5px; color:var(--review)}

/* ---------- history ---------- */
.hgrid{display:flex; gap:5px; flex-wrap:wrap}
.hcell{
  width:40px; border:1px solid var(--line); border-radius:8px; background:var(--surface);
  padding:6px 0 5px; text-align:center; cursor:pointer;
}
.hcell[aria-current="true"]{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
.hcell .hd{font-family:var(--mono); font-size:10px; color:var(--faint)}
.hcell .hn{font-family:var(--mono); font-size:13px; font-weight:600; font-variant-numeric:tabular-nums}
.hcell .hbar{height:4px; border-radius:2px; margin:4px 5px 0; background:var(--line)}

/* ---------- matrix ---------- */
.mx{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
.mxr{display:grid; grid-template-columns:1.1fr 1.3fr 1.3fr; gap:0; border-bottom:1px solid var(--line)}
.mxr:last-child{border-bottom:0}
.mxr>div{padding:9px 12px; font-size:12.5px; border-right:1px solid var(--line); min-width:0}
.mxr>div:last-child{border-right:0}
.mxh>div{
  font-family:var(--cond); font-size:10.5px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--faint); font-weight:600; background:var(--surface2);
}
.mxr .nm{font-weight:600}
.mxr .yes{color:var(--ok)} .mxr .no{color:var(--review)}

/* ---------- queue ---------- */
.qitem{
  background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--bad);
  border-radius:var(--radius); padding:10px 13px; margin-bottom:9px;
  display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap;
}
.qitem.warn{border-left-color:var(--warn)}
.qitem .qm{flex:1; min-width:180px}
.qday{font-family:var(--mono); font-size:11px; color:var(--faint)}
.empty{color:var(--muted); font-size:13.5px; padding:12px 2px}

/* ---------- lightbox ---------- */
#lightbox{
  position:fixed; inset:0; z-index:90; background:rgba(8,14,13,.86);
  display:grid; place-items:center; padding:20px;
}
#lightbox img{max-width:100%; max-height:84vh; border-radius:8px; display:block}
#lightbox .lbmeta{
  color:#E9EFED; font-family:var(--mono); font-size:11.5px; margin-top:10px; text-align:center;
  max-width:560px;
}

@media (max-width:600px){
  .cardin{grid-template-columns:1fr}
  .rail{
    border-right:0; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:8px; padding:8px 14px; text-align:left;
  }
  .rail .z{margin-top:0}
  .rail .cad{margin-top:0}
  .trow{grid-template-columns:auto 1fr; }
  .tact{grid-column:2; justify-content:flex-start; margin-top:2px}
  .verdict,.notefield{margin-left:0; width:100%}
  .mxr{grid-template-columns:1fr}
  .mxr>div{border-right:0; border-bottom:1px solid var(--line)}
  .mxr>div:last-child{border-bottom:0}
  .mxh{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>

<header class="top">
  <div class="topin">

let chain = Promise.resolve();
const queue = fn => (chain = chain.catch(() => {}).then(fn), chain);

function dayRef(k) { return S.db.doc("days/" + k); }

function patchItem(k, patch) {
  if (!S.db) return Promise.resolve();
  const key = S.dayKey, ref = dayRef(key);
  return queue(async () => {
    const snap = await ref.get();
    const body = { items: {} }; body.items[k] = patch;
    if (!snap.exists) {
      body.dayKey = key; body.createdAt = new Date().toISOString();
      await ref.set(body);
    } else {
      await ref.update(body);
    }
  });
}

function mutateProofs(k, fn) {
  if (!S.db) return Promise.resolve();
  const key = S.dayKey, ref = dayRef(key);
  return queue(async () => {
    const snap = await ref.get();
    const data = snap.exists ? snap.data() : null;
    const cur = (((data || {}).items || {})[k] || {}).proofs || [];
    const next = fn(cur.map(p => Object.assign({}, p)));
    const body = { items: {} }; body.items[k] = { proofs: next };
    if (!snap.exists) { body.dayKey = key; body.createdAt = new Date().toISOString(); await ref.set(body); }
    else { await ref.update(body); }
  });
}

function recordHash(sha, ph, k) {
  if (!S.db) return Promise.resolve();
  const month = S.dayKey.slice(0, 7), ref = S.db.doc("hashes/" + month);
  const entry = { p: ph, d: S.dayKey, i: k, t: Date.now() };
  S.hashes[sha] = entry;
  return queue(async () => {
    const snap = await ref.get();
    const body = { entries: {} }; body.entries[sha] = entry;
    if (!snap.exists) { body.month = month; await ref.set(body); }
    else { await ref.update(body); }
  });
}

async function loadHashes() {
  if (!S.db) return;
  const months = [S.dayKey.slice(0, 7), shiftKey(S.dayKey, -31).slice(0, 7)];
  for (const m of months) {
    try {
      const snap = await S.db.doc("hashes/" + m).get();
      if (snap.exists) Object.assign(S.hashes, (snap.data() || {}).entries || {});
    } catch (e) { /* indeks duplikat opsional */ }
  }
}

/* ======================== sidik jari gambar ======================== */
async function sha256(buf) {
  const d = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2, "0")).join("");
}
const POP = n => { let c = 0; while (n) { c += n & 1; n >>= 1; } return c; };
function hamming(a, b) {
  if (!a || !b || a.length !== b.length) return 64;
  let d = 0; for (let i = 0; i < a.length; i++) d += POP(parseInt(a[i], 16) ^ parseInt(b[i], 16));
  return d;
}
async function fingerprint(file) {
  const bmp = await createImageBitmap(file);
  const W = 9, H = 8, w0 = bmp.width, h0 = bmp.height;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(bmp, 0, 0, W, H);
  const d = ctx.getImageData(0, 0, W, H).data;
  let bits = "";
  for (let y = 0; y < H; y++) for (let x = 0; x < W - 1; x++) {
    const i = (y * W + x) * 4, j = (y * W + x + 1) * 4;
    const a = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    const b = 0.299 * d[j] + 0.587 * d[j + 1] + 0.114 * d[j + 2];
    bits += a > b ? "1" : "0";
  }
  let hex = ""; for (let k = 0; k < 64; k += 4) hex += parseInt(bits.slice(k, k + 4), 2).toString(16);
  // versi ringan untuk disimpan & dibaca Claude
  const MAX = 1600, sc = Math.min(1, MAX / Math.max(w0, h0));
  const c2 = document.createElement("canvas");
  c2.width = Math.max(1, Math.round(w0 * sc)); c2.height = Math.max(1, Math.round(h0 * sc));
  c2.getContext("2d").drawImage(bmp, 0, 0, c2.width, c2.height);
  if (bmp.close) bmp.close();
  const blob = await new Promise(r => c2.toBlob(r, "image/jpeg", 0.8));
  return { hex: hex, w: w0, h: h0, blob: blob };
}
function nearestHash(hex) {
  let best = null;
  for (const sha in S.hashes) {
    const e = S.hashes[sha], d = hamming(hex, e.p);
    if (!best || d < best.d) best = { d: d, day: e.d, item: e.i };
  }
  return best;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
async function drive(tool, input) {
  let last;
  for (let i = 0; i < 2; i++) {
    try {
      const res = await S.mcp.callTool("Google Drive", tool, input, { cache: false });
      const p = res.payload;
      if (typeof p === "string") { try { return JSON.parse(p); } catch (_) { return { raw: p }; } }
      return p || {};
    } catch (e) {
      last = e;
      if (e && e.retryable === true && i === 0) { await sleep(Math.min(e.retryAfterMs || 1200, 4000)); continue; }
      throw e;
    }
  }
  throw last;
}

async function checkCompset(k) {
  const r = await drive("read_file_content", { fileId: SRC.compsetSheet });
  const body = String(r.fileContent || r.raw || "");
  const p = k.split("-").map(Number);
  const seen = {}; let rows = 0;
  body.split("\n").forEach(line => {
    if (line.charAt(0) !== "|") return;
    const c = line.split("|").map(s => s.trim());
    const m = (c[1] || "").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})/);
    if (!m) return;
    rows++;
    if (+m[3] !== p[0] || +m[1] !== p[1] || +m[2] !== p[2]) return;
    const slot = (c[2] || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    const mins = (+m[4]) * 60 + (+m[5]);
    if (!(slot in seen) || mins < seen[slot]) seen[slot] = mins;
  });
  if (!rows) return { _all: { status: "unknown", detail: "Sheet jawaban compset tidak terbaca (format berubah atau file terlalu besar)." } };
  const out = {};
  TASK_BY_ID.compset.targets.forEach(t => {
    const got = seen[t.slot.replace(/[^a-z0-9]/g, "")];
    if (got == null) {
      out[t.id] = { status: "missing", detail: "Slot " + t.label + " belum ada di sheet." };
    } else {
      const late = got - toMin(t.at);
      out[t.id] = late > GRACE
        ? { status: "late", detail: "Diisi " + pad(Math.floor(got / 60)) + ":" + pad(got % 60) + " — telat " + late + " menit.", late: late }
        : { status: "ok", detail: "Diisi " + pad(Math.floor(got / 60)) + ":" + pad(got % 60) + " WIB." };
    }
  });
  return out;
}

async function checkDrr(k) {
  const r = await drive("get_file_metadata", { fileId: SRC.drrSheet, excludeContentSnippets: true });
  const mt = Date.parse(r.modifiedTime || "");
  if (isNaN(mt)) return { x: { status: "unknown", detail: "Waktu ubah sheet DRR tidak terbaca." } };
  const d = dayOfMs(mt);
  if (d === k) return { x: { status: "ok", detail: "Sheet “DRR 2026” diubah " + clockOf(mt) + " WIB hari ini." } };
  return { x: { status: "missing", detail: "Sheet “DRR 2026” belum diubah hari ini. Terakhir: " + longDate(d) + " " + clockOf(mt) + " WIB." } };
}

async function checkVoucher(k) {
  const p = k.split("-");
  const mName = BLN_EN[+p[1] - 1] + " " + p[0], dName = p[2] + " " + mName;
  const mf = await drive("search_files", { query: "parentId = '" + SRC.voucherRoot + "' and title = '" + mName + "'", excludeContentSnippets: true, pageSize: 5 });
  const mid = ((mf.files || [])[0] || {}).id;
  if (!mid) return { x: { status: "unknown", detail: "Folder bulan “" + mName + "” belum ada di Drive Verse Cirebon." } };
  const df = await drive("search_files", { query: "parentId = '" + mid + "' and title = '" + dName + "'", excludeContentSnippets: true, pageSize: 5 });
  const did = ((df.files || [])[0] || {}).id;
  if (!did) return { x: { status: "missing", detail: "Folder “" + dName + "” belum dibuat." } };
  const ls = await drive("search_files", { query: "parentId = '" + did + "'", excludeContentSnippets: true, pageSize: 100 });
  const files = (ls.files || []).filter(f => f.mimeType !== "application/vnd.google-apps.folder");
  if (!files.length) return { x: { status: "missing", detail: "Folder “" + dName + "” masih kosong." } };
  let late = 0, last = 0;
  files.forEach(f => {
    const t = Date.parse(f.createdTime || "");
    if (isNaN(t)) return;
    if (t > last) last = t;
    if (dayOfMs(t) > k) late++;
  });
  const tail = files.length + " file" + (last ? ", upload terakhir " + clockOf(last) + " WIB" : "") + ".";
  if (late) return { x: { status: "late", detail: tail + " " + late + " file baru masuk setelah lewat tengah malam." } };
  return { x: { status: "ok", detail: tail } };
}

const OKTYPE = { "image/png": 1, "image/jpeg": 1, "image/webp": 1, "image/gif": 1 };

async function onPick(task, tgt, file) {
  const k = keyFor(task, tgt);
  if (!S.assets || !S.db || S.busy[k]) return;
  S.busy[k] = "Memproses…"; render();
  try {
    if (file.size > 25 * 1024 * 1024) throw new Error("File terlalu besar (maks 25 MB).");
    const buf = await file.arrayBuffer();
    const sha = (await sha256(buf)).slice(0, 24);

    let fp;
    try { fp = await fingerprint(file); }
    catch (_) { throw new Error("Gambar tidak terbaca. Pakai format PNG atau JPG."); }

    const flags = [];
    if (S.hashes[sha]) {
      const e = S.hashes[sha];
      throw new Error("Screenshot ini sudah pernah dipakai (" + longDate(e.d) + "). Ambil screenshot baru.");
    }
    const near = nearestHash(fp.hex);
    if (near && near.d <= 5 && near.day !== S.dayKey) flags.push("mirip:" + near.day);
    if (file.lastModified && dayOfMs(file.lastModified) !== S.dayKey) flags.push("file:" + dayOfMs(file.lastModified));

    S.busy[k] = "Mengunggah…"; render();
    const blob = fp.blob || file;
    const up = await S.assets.upload(blob, { type: OKTYPE[blob.type] ? blob.type : "image/jpeg" });

    const at = Date.now();
    const proof = {
      id: up.id, name: String(file.name || "bukti").slice(0, 80), bytes: up.sizeBytes,
      w: fp.w, h: fp.h, sha: sha, ph: fp.hex, fmod: file.lastModified || 0,
      at: at, by: S.me.id, byName: S.me.name, flags: flags, mins: nowMins()
    };
    await mutateProofs(k, list => list.concat([proof]).slice(-4));
    await recordHash(sha, fp.hex, k);
    S.busy[k] = null; render();
    runAi(task, tgt, k, blob, up.id);
  } catch (e) {
    S.busy[k] = null;
    alert(e && e.code ? uploadCopy(e.code) : (e && e.message) || "Gagal mengunggah bukti.");
    render();
  }
}
function uploadCopy(code) {
  switch (code) {
    case "too_large": return "File terlalu besar untuk disimpan.";
    case "unsupported_type": return "Format tidak didukung. Pakai PNG atau JPG.";
    case "quota_or_state": return "Penyimpanan bukti penuh. Minta owner membersihkan bukti lama.";
    case "rate_limited": return "Terlalu cepat. Tunggu sebentar lalu coba lagi.";
    case "upstream_auth": return "Sesi habis — muat ulang halaman.";
    case "not_granted": case "capability_disabled": return "Akun ini tidak punya izin mengunggah bukti.";
    default: return "Gagal mengunggah bukti. Coba lagi.";
  }
}

function blocked(task, tgt, r) {
  if (!isToday() || S.canWrite === false) return "kunci";
  if (autoPass(r)) return null;
  if (!hasProof(r)) return "bukti";
  if (task.noteRequired && !(r.note || "").trim()) return "catatan";
  return null;
}
const minsOf = ms => { const d = wib(ms); return d.getUTCHours() * 60 + d.getUTCMinutes(); };

// Keterlambatan yang berarti: kalau ada pemeriksaan otomatis, yang dihitung adalah kapan
// pekerjaannya benar-benar masuk di sumbernya — bukan kapan Naurah sempat mencentang.
function lateOf(task, tgt, r) {
  if (r.auto) return r.auto.status === "late" ? (r.auto.late || 1) : 0;
  if (r.done && r.at != null) return Math.max(0, minsOf(r.at) - toMin(tgt.at || task.due));
  return 0;
}

function weekCount(task) {
  const d = dtOf(S.viewKey), dow = (d.getUTCDay() + 6) % 7;   // Senin = 0
  let n = 0;
  for (let i = 0; i <= dow; i++) {
    const day = S.days[shiftKey(S.viewKey, -i)];
    if (!day) continue;
    task.targets.forEach(t => { if (((day.items || {})[keyFor(task, t)] || {}).done) n++; });
  }
  return n;
}

/* ============================== tampilan ============================== */
function chip(text, cls) { return el("span", "chip" + (cls ? " " + cls : ""), text); }

function patchItemOn(day, k, patch) {
  if (!S.db) return Promise.resolve();
  const ref = dayRef(day);
  return queue(async () => {
    const snap = await ref.get();
    const body = { items: {} }; body.items[k] = patch;
    if (!snap.exists) { body.dayKey = day; body.createdAt = new Date().toISOString(); await ref.set(body); }
    else { await ref.update(body); }
  });
}

function reqTargets(t) { return t.targets.filter(g => !g.optional); }

function dayStats(key) {
  const day = S.days[key] || {}, items = day.items || {};
  let total = 0, ok = 0, late = 0, flag = 0;
  TASKS.forEach(t => reqTargets(t).forEach(g => {
    total++;
    const r = items[keyFor(t, g)] || {};
    if (!r.done) {
      if (r.auto && (r.auto.status === "missing" || r.auto.status === "late")) flag++;
      return;
    }
    const bad = (r.proofs || []).some(p => (p.ai && p.ai.st === "bad") || (p.flags || []).length) ||
                (r.auto && r.auto.status === "late");
    if (bad) flag++;
    else if (lateOf(t, g, r) > 0) late++;
    else ok++;
  }));
  return { total: total, ok: ok, late: late, flag: flag, done: ok + late + flag };
}

function renderHead() {
  const st = dayStats(S.viewKey);
  $("dateline").textContent = longDate(S.viewKey) + (isToday() ? "" : " · terkunci");
  const pc = n => st.total ? (n / st.total * 100).toFixed(2) + "%" : "0";
  const bars = $("daybar").children;
  bars[0].style.width = pc(st.ok); bars[1].style.width = pc(st.late); bars[2].style.width = pc(st.flag);
  const tal = $("tallies"); tal.textContent = "";
  const add = (color, label, n) => {
    const s = el("span");
    const d = el("i", "dot"); d.style.background = color; d.style.display = "inline-block";
    s.appendChild(d); s.appendChild(el("b", null, String(n))); s.appendChild(document.createTextNode(" " + label));
    tal.appendChild(s);
  };
  add("var(--ok)", "tepat waktu", st.ok);
  add("var(--warn)", "telat", st.late);
  add("var(--bad)", "perlu dicek", st.flag);
  add("var(--line2)", "belum", st.total - st.done);
  tal.appendChild(el("span", null, "— " + st.done + "/" + st.total + " bukti"));
}

function tickClock() {
  const d = wib();
  $("clock").textContent = pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes()) + ":" + pad(d.getUTCSeconds()) + " WIB";
  const left = 86400000 - (d.getUTCHours() * 3600000 + d.getUTCMinutes() * 60000 + d.getUTCSeconds() * 1000);
  const li = $("lockin");
  li.hidden = !isToday();
  if (isToday()) li.textContent = "terkunci dalam " + durTxt(left);
}

function proofChips(box, task, tgt, r) {
  (r.proofs || []).forEach(p => {
    (p.flags || []).forEach(f => {
      if (f.indexOf("mirip:") === 0) box.appendChild(chip("mirip " + shortDate(f.slice(6)), "bad"));
      else if (f.indexOf("file:") === 0) box.appendChild(chip("file " + shortDate(f.slice(5)), "warn"));
    });
    const a = p.ai;
    if (!a) return;
    if (a.st === "run") box.appendChild(chip("Claude membaca…", "acc"));
    else if (a.st === "ok") box.appendChild(chip("Claude: cocok", "ok"));
    else if (a.st === "warn") box.appendChild(chip("Claude: ragu", "warn"));
    else if (a.st === "bad") box.appendChild(chip("Claude: tidak cocok", "bad"));
  });
}
function shortDate(k) { const p = k.split("-"); return (+p[2]) + " " + BLN[+p[1] - 1].slice(0, 3); }

function buildRow(task, tgt) {
  const k = keyFor(task, tgt), r = rec(k), row = el("div", "trow");
  row.dataset.k = k;

  const tick = el("button", "tick", "✓");
  tick.setAttribute("role", "checkbox");
  tick.setAttribute("aria-checked", r.done ? "true" : "false");
  tick.setAttribute("aria-label", "Centang " + tgt.label);
  const why = blocked(task, tgt, r);
  tick.disabled = !!why && !r.done;
  if (r.done && !isToday()) tick.disabled = true;
  tick.onclick = () => toggle(task, tgt);
  row.appendChild(tick);

  const main = el("div", "tmain");
  const lab = el("div", "tlabel", tgt.label);
  if (tgt.sub) lab.appendChild(el("small", null, tgt.sub));
  main.appendChild(lab);

  const chips = el("div", "chips");
  const lateBy = lateOf(task, tgt, r);
  if (r.done) {
    const own = (!r.auto && lateBy > 0) ? " (telat " + lateBy + "m)" : "";
    chips.appendChild(chip("✓ " + (r.at ? clockOf(r.at) : "—") + own, lateBy > 0 ? "warn" : "ok"));
    if (r.byName) chips.appendChild(chip(r.byName));
  } else if (tgt.optional) {
    chips.appendChild(chip("opsional"));
  } else if (!r.auto && isToday() && nowMins() > toMin(tgt.at || task.due)) {
    chips.appendChild(chip("lewat " + (tgt.at || task.due), "warn"));
  }
  if (r.auto) {
    const m = { ok: "ok", late: "warn", missing: "bad", unknown: "", error: "" };
    chips.appendChild(chip("Drive: " + ({ ok: "terverifikasi", late: "telat", missing: "belum ada", unknown: "tak terbaca", error: "gagal" }[r.auto.status] || r.auto.status), m[r.auto.status]));
  }
  proofChips(chips, task, tgt, r);
  if (r.review) chips.appendChild(chip(r.review.st === "ok" ? "owner: OK" : "owner: tidak OK", r.review.st === "ok" ? "ok" : "bad"));
  if (S.busy[k]) chips.appendChild(chip(S.busy[k], "acc"));
  main.appendChild(chips);
  row.appendChild(main);

  const act = el("div", "tact");
  const thumbs = el("div", "thumbs");
  (r.proofs || []).forEach(p => {
    const b = el("button", "thumb");
    b.title = "Lihat bukti";
    const img = el("img"); img.src = "/_blob/" + p.id; img.alt = "Bukti " + tgt.label; img.loading = "lazy";
    b.appendChild(img);
    b.onclick = () => openLightbox(task, tgt, p, r);
    thumbs.appendChild(b);
  });
  act.appendChild(thumbs);

  if (isToday() && S.assets && S.canWrite !== false && (r.proofs || []).length < 4) {
    const lab2 = el("label", "btn tiny");
    lab2.textContent = (r.proofs || []).length ? "+ bukti" : "Bukti";
    const inp = el("input"); inp.type = "file"; inp.accept = "image/png,image/jpeg,image/webp,image/gif"; inp.hidden = true;
    inp.onchange = e => { const f = e.target.files && e.target.files[0]; e.target.value = ""; if (f) onPick(task, tgt, f); };
    lab2.appendChild(inp);
    act.appendChild(lab2);
  }
  row.appendChild(act);

  const last = (r.proofs || []).slice(-1)[0];
  if (last && last.ai && last.ai.kata) {
    const v = el("div", "verdict " + (last.ai.st === "ok" ? "ok" : last.ai.st === "bad" ? "bad" : last.ai.st === "warn" ? "warn" : ""));
    let line = last.ai.kata;
    const bits = [];
    if (last.ai.tgl) bits.push("tanggal terbaca " + last.ai.tgl);
    if (last.ai.jam) bits.push("jam " + last.ai.jam);
    if (last.ai.issues && last.ai.issues.length) bits.push(last.ai.issues.join("; "));
    if (bits.length) line += " — " + bits.join(", ");
    v.textContent = line;
    row.appendChild(v);
  }
  if (r.auto && r.auto.detail) {
    const v = el("div", "verdict " + (r.auto.status === "ok" ? "ok" : r.auto.status === "late" ? "warn" : r.auto.status === "missing" ? "bad" : ""));
    v.textContent = r.auto.detail;
    row.appendChild(v);
  }
  if (task.noteRequired || tgt.note) {
    const ta = el("textarea", "notefield");
    ta.placeholder = "Catatan hasil (wajib)";
    ta.value = r.note || "";
    ta.dataset.notekey = k;
    ta.disabled = !isToday() || S.canWrite === false;
    ta.onchange = e => patchItem(k, { note: String(e.target.value).slice(0, 500) });
    row.appendChild(ta);
  }
  return row;
}

function buildCard(task) {
  const card = el("div", "card"), inner = el("div", "cardin");
  const rail = el("div", "rail");
  rail.appendChild(el("div", "t", task.span ? task.span.split(" ")[0] : task.due));
  rail.appendChild(el("div", "z", "WIB"));
  if (task.cadence) {
    const n = weekCount(task);
    rail.appendChild(el("div", "cad", n + "/" + task.cadence + " minggu ini"));
  } else if (task.span) {
    rail.appendChild(el("div", "cad", "6 slot"));
  }
  inner.appendChild(rail);

  const body = el("div", "body");
  const tr = el("div", "titlerow"), left = el("div");
  left.appendChild(el("div", "tname", task.title));
  left.appendChild(el("div", "tsub", task.sub));
  tr.appendChild(left);
  const bmap = { auto: ["b-auto", "Otomatis"], ai: ["b-ai", "Dibaca Claude"], manual: ["b-manual", "Manual"] };
  const bd = bmap[task.tier];
  tr.appendChild(el("span", "badge " + bd[0], bd[1]));
  body.appendChild(tr);

  if (task.auto) {
    const bar = el("div", "chips"); bar.style.marginTop = "9px";
    const b = el("button", "btn tiny primary", S.busy["auto:" + task.id] ? "Memeriksa…" : "Periksa otomatis");
    b.disabled = !S.mcp || !!S.busy["auto:" + task.id];
    b.onclick = () => runAuto(task);
    bar.appendChild(b);
    if (!S.mcp) bar.appendChild(chip("Google Drive tidak tersedia di tampilan ini", "warn"));
    else bar.appendChild(chip("baca langsung dari sumbernya di Drive"));
    body.appendChild(bar);
  }

  const rows = el("div", "rows");
  task.targets.forEach(g => rows.appendChild(buildRow(task, g)));
  body.appendChild(rows);

  const mc = el("div", "mycheck");
  mc.appendChild(el("b", null, "Saya cek sendiri "));
  mc.appendChild(document.createTextNode(task.mine));
  body.appendChild(mc);

  inner.appendChild(body);
  card.appendChild(inner);
  return card;
}

function renderHistory() {
  const g = $("hgrid"); g.textContent = "";
  for (let i = 13; i >= 0; i--) {
    const k = shiftKey(S.dayKey, -i), st = dayStats(k);
    const c = el("button", "hcell");
    c.setAttribute("aria-current", k === S.viewKey ? "true" : "false");
    c.title = longDate(k) + " — " + st.done + "/" + st.total;
    c.appendChild(el("div", "hd", HARI3[dtOf(k).getUTCDay()]));
    c.appendChild(el("div", "hn", k.slice(8)));
    const bar = el("div", "hbar");
    if (st.done) {
      const good = st.ok / st.total;
      bar.style.background = st.flag ? "var(--bad)" : good >= 0.9 ? "var(--ok)" : good >= 0.5 ? "var(--warn)" : "var(--line2)";
    }
    c.appendChild(bar);
    c.onclick = () => { S.viewKey = k; render(); window.scrollTo({ top: 0, behavior: "smooth" }); };
    g.appendChild(c);
  }
  $("backToday").hidden = isToday();
}

function renderMatrix() {
  const m = $("mx"); m.textContent = "";
  const head = el("div", "mxr mxh");
  ["Tugas", "Diperiksa sistem", "Anda cek sendiri"].forEach(h => head.appendChild(el("div", null, h)));
  m.appendChild(head);
  TASKS.forEach(t => {
    const r = el("div", "mxr");
    const a = el("div"); a.appendChild(el("div", "nm", t.title));
    a.appendChild(el("div", null, ({ auto: "otomatis dari sumbernya", ai: "screenshot dibaca Claude", manual: "manual" })[t.tier]));
    a.lastChild.style.color = "var(--faint)"; a.lastChild.style.fontSize = "11.5px";
    r.appendChild(a);
    const b = el("div", "yes", t.sys); r.appendChild(b);
    const c = el("div", "no", t.mine); r.appendChild(c);
    m.appendChild(r);
  });
}

function renderQueue() {
  const sec = $("queueSec"), box = $("queue");
  sec.hidden = false;
  sec.querySelector("h2").textContent = S.isOwner ? "Antrean review owner" : "Perlu diperbaiki";
  box.textContent = "";
  const found = [];
  for (let i = 0; i < 21; i++) {
    const k = shiftKey(S.dayKey, -i), day = S.days[k];
    if (!day) continue;
    TASKS.forEach(t => t.targets.forEach(g => {
      const key = keyFor(t, g), r = (day.items || {})[key] || {};
      if (r.review) return;
      const reasons = [];
      (r.proofs || []).forEach(p => {
        (p.flags || []).forEach(f => {
          if (f.indexOf("mirip:") === 0) reasons.push("screenshot mirip dengan " + shortDate(f.slice(6)));
          if (f.indexOf("file:") === 0) reasons.push("file screenshot bertanggal " + shortDate(f.slice(5)));
        });
        if (p.ai && p.ai.st === "bad") reasons.push("Claude: " + (p.ai.kata || "tidak cocok"));
      });
      if (r.auto && r.auto.status === "missing" && !r.done) reasons.push(r.auto.detail);
      if (r.auto && r.auto.status === "late") reasons.push(r.auto.detail);
      if (!reasons.length) return;
      found.push({ day: k, key: key, task: t, tgt: g, r: r, reasons: reasons });
    }));
  }
  if (!found.length) { box.appendChild(el("div", "empty", S.isOwner ? "Tidak ada yang perlu review — semua bukti lolos pemeriksaan otomatis." : "Tidak ada bukti yang ditandai. Bagus.")); return; }
  found.slice(0, 40).forEach(f => {
    const hard = f.reasons.some(x => /mirip|tidak cocok|belum/.test(x));
    const it = el("div", "qitem" + (hard ? "" : " warn"));
    const thumbs = el("div", "thumbs");
    (f.r.proofs || []).forEach(p => {
      const b = el("button", "thumb");
      const img = el("img"); img.src = "/_blob/" + p.id; img.alt = "Bukti"; img.loading = "lazy";
      b.appendChild(img); b.onclick = () => openLightbox(f.task, f.tgt, p, f.r);
      thumbs.appendChild(b);
    });
    if ((f.r.proofs || []).length) it.appendChild(thumbs);
    const mid = el("div", "qm");
    mid.appendChild(el("div", "qday", longDate(f.day)));
    mid.appendChild(el("div", null, f.task.title + " — " + f.tgt.label));
    mid.lastChild.style.fontWeight = "600";
    f.reasons.slice(0, 3).forEach(x => { const d = el("div", null, x); d.style.color = "var(--muted)"; d.style.fontSize = "12.5px"; mid.appendChild(d); });
    it.appendChild(mid);
    if (S.isOwner) {
      const act = el("div", "tact");
      const ok = el("button", "btn tiny", "Saya terima");
      ok.onclick = () => patchItemOn(f.day, f.key, { review: { st: "ok", by: S.me.name || S.me.id, at: Date.now() } });
      const no = el("button", "btn tiny", "Tidak OK");
      no.onclick = () => patchItemOn(f.day, f.key, { review: { st: "no", by: S.me.name || S.me.id, at: Date.now() }, done: false });
      act.appendChild(ok); act.appendChild(no);
      it.appendChild(act);
    }
    box.appendChild(it);
  });
}

function openLightbox(task, tgt, p, r) {
  const lb = $("lightbox");
  $("lbimg").src = "/_blob/" + p.id;
  const bits = [task.title + " — " + tgt.label, "diunggah " + clockOf(p.at) + " WIB" + (p.byName ? " oleh " + p.byName : ""),
                p.w + "×" + p.h + " px", "sidik jari " + p.sha.slice(0, 12)];
  if (p.fmod) bits.push("file dibuat " + shortDate(dayOfMs(p.fmod)) + " " + clockOf(p.fmod));
  if (p.ai && p.ai.kata) bits.push("Claude: " + p.ai.kata);
  $("lbmeta").textContent = bits.join(" · ");
  lb.hidden = false;
  const close = e => { if (e.target.tagName !== "IMG") { lb.hidden = true; lb.removeEventListener("click", close); } };
  lb.addEventListener("click", close);
}

function render() {
  const af = document.activeElement;
  const noteKey = af && af.dataset ? af.dataset.notekey : null;
  const caret = noteKey ? af.selectionStart : null;

  renderHead();
  $("lockedNote").hidden = isToday();
  if (!isToday()) $("lockedNote").textContent = "Hari ini hanya bisa dilihat. Centang dan bukti hanya bisa diisi pada tanggal berjalan — " + longDate(S.dayKey) + ".";

  const board = $("board"); board.textContent = "";
  TASKS.forEach(t => board.appendChild(buildCard(t)));
  renderHistory(); renderMatrix(); renderQueue();

  if (noteKey) {
    const back = document.querySelector('[data-notekey="' + noteKey + '"]');
    if (back) { back.focus(); try { back.setSelectionRange(caret, caret); } catch (_) {} }
  }
}

async function toggle(task, tgt) {
  const k = keyFor(task, tgt), r = rec(k);
  if (!isToday() || S.canWrite === false) return;
  if (r.done) { await patchItem(k, { done: false, at: null, by: null, byName: null }); return; }
  const why = blocked(task, tgt, r);
  if (why) {
    alert({
      bukti: "Unggah bukti screenshot dulu — centang baru terbuka setelah ada bukti.",
      catatan: "Isi dulu catatan hasilnya.",
      kunci: "Hari ini sudah terkunci."
    }[why] || "Belum bisa dicentang.");
    return;
  }
  await patchItem(k, { done: true, at: Date.now(), by: S.me.id, byName: S.me.name });
}

/* ================================ boot ================================ */
function banner(msg, cls) {
  const b = $("conn");
  b.hidden = !msg;
  if (msg) { b.textContent = ""; b.appendChild(el("strong", null, cls === "err" ? "Belum tersambung. " : "Catatan. ")); b.appendChild(document.createTextNode(msg)); }
}

const useCap = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);

async function boot() {
  render(); tickClock();
  setInterval(tickClock, 1000);
  setInterval(() => {
    const t = todayKey();
    if (t !== S.dayKey) {
      const wasToday = isToday();
      S.dayKey = t; if (wasToday) S.viewKey = t;
      S.hashes = {}; loadHashes().then(render);
      render();
    }
  }, 15000);

  $("backToday").onclick = () => { S.viewKey = S.dayKey; render(); };

  const caps = await Promise.all([useCap("db"), useCap("assets"), useCap("sample"), useCap("mcp"), useCap("user")]);
  S.db = caps[0]; S.assets = caps[1]; S.sample = caps[2]; S.mcp = caps[3]; S.ucap = caps[4];

  if (S.ucap) {
    try {
      const me = await S.ucap.me();
      S.me = { id: me.id || null, name: me.name || "" };
      S.isOwner = !!me.isOwner;
    } catch (_) {}
    try { S.canWrite = await S.ucap.can("data.write"); } catch (_) { S.canWrite = null; }
    $("who").textContent = "masuk sebagai " + (S.me.name || "—") + (S.isOwner ? " · owner" : "");
  }
  if (S.sample) {
    try { const l = await S.sample.limits(); S.images = !!(l && l.images); } catch (_) { S.images = false; }
  }

  if (!S.db) {
    banner("Halaman ini menyimpan centang dan bukti di penyimpanan bersama Artifact. Buka lewat tautan claude.ai sambil masuk ke akun yang diberi akses — dari salinan file biasa, isian tidak tersimpan.", "err");
    render(); return;
  }
  if (!S.assets) banner("Akun ini bisa melihat, tapi tidak bisa mengunggah bukti. Minta owner memberi akses “Can interact” atau lebih.", "ok");
  else if (!S.images) banner("Pemeriksaan gambar oleh Claude tidak aktif di tampilan ini — bukti tetap tersimpan dan tetap dihitung duplikatnya.", "ok");

  await loadHashes();
  S.unsub = S.db.collection("days").orderBy("dayKey", "desc").limit(21).onSnapshot(
    snap => { const m = {}; snap.docs.forEach(d => { m[d.id] = d.data() || {}; }); S.days = m; render(); },
    err => { banner(err && err.code === "revoked" ? "Akses ke data halaman ini dicabut. Muat ulang setelah akses dipulihkan."
                                                  : "Data tidak bisa dimuat sekarang. Muat ulang halaman.", "err"); }
  );
  render();
}

boot();
})();
</script>
