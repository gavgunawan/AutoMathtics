* { box-sizing: border-box; }
html { min-height: 100%; background: #07091A; scroll-behavior: smooth; }
body { min-height: 100vh; margin: 0; background: #07091A; overflow-x: hidden; }
#root { min-height: 100vh; }
body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
button { -webkit-tap-highlight-color: transparent; transition: transform .22s cubic-bezier(.2,.8,.2,1), filter .22s ease, box-shadow .22s ease, background-color .22s ease, border-color .22s ease, opacity .22s ease; }
@media (hover: hover) and (pointer: fine) {
  button:not(.player-card):not(:disabled):hover { transform: translateY(-1px); filter: brightness(1.1) saturate(1.05); }
}
/* every screen glides in instead of snapping \u2014 the class is on each screen's root, and each root
   only mounts when its screen is shown, so a screen change is exactly one run of this */
@keyframes screenIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.screen { animation: screenIn .36s cubic-bezier(.16,1,.3,1) both; }
/* question swap: the old one is gone, the new one slides in from the right */
@keyframes qIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
.qin { animation: qIn .26s cubic-bezier(.16,1,.3,1) both; }
.padkey:active { transform: scale(.93) !important; filter: brightness(1.25); transition-duration: .06s; }
.shopitem { transition: transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s ease, border-color .28s ease; }
@media (hover: hover) and (pointer: fine) { .shopitem:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(0,0,0,.35); } }
/* the question sheet warms up as the streak climbs \u2014 same ladder as the pet and the combo shout */
.sheet { transition: box-shadow .5s ease, border-color .5s ease; }
.sheet-hot-1 { border-color: #35E0FF !important; box-shadow: 0 0 22px rgba(53,224,255,.22) !important; }
.sheet-hot-2 { border-color: #8A5CFF !important; box-shadow: 0 0 26px rgba(138,92,255,.3) !important; }
.sheet-hot-3 { border-color: #FF2DA8 !important; box-shadow: 0 0 30px rgba(255,45,168,.36) !important; }
.sheet-hot-4 { border-color: #FFB020 !important; box-shadow: 0 0 36px rgba(255,176,32,.42), 0 0 70px rgba(255,176,32,.18) !important; }
.app-page::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(83,115,255,.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(83,115,255,.055) 1px, transparent 1px);
  background-size: 54px 54px;
  mask-image: radial-gradient(circle at 50% 38%, black 12%, transparent 78%);
  -webkit-mask-image: radial-gradient(circle at 50% 38%, black 12%, transparent 78%);
  opacity: .62;
}
.app-page::after {
  content: "";
  position: fixed;
  width: 52vw;
  height: 52vw;
  min-width: 560px;
  min-height: 560px;
  left: 50%;
  top: 48%;
  z-index: -1;
  pointer-events: none;
  border-radius: 50%;
  background: conic-gradient(from 180deg, rgba(255,45,168,.13), rgba(53,224,255,.11), rgba(138,92,255,.13), rgba(255,45,168,.13));
  filter: blur(86px);
  transform: translate(-50%, -50%);
  animation: auroraDrift 16s ease-in-out infinite alternate;
}
@keyframes auroraDrift {
  from { transform: translate(-53%, -51%) rotate(-8deg) scale(.92); opacity: .72; }
  to { transform: translate(-47%, -47%) rotate(12deg) scale(1.08); opacity: 1; }
}
.player-select-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(115deg, transparent 0 43%, rgba(255,255,255,.026) 48%, transparent 54%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 5px);
  opacity: .68;
}
.player-select-shell::after {
  content: "";
  position: absolute;
  left: 12%;
  right: 12%;
  top: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, #FF2DA8, #35E0FF, transparent);
  box-shadow: 0 0 28px rgba(53,224,255,.52), 0 0 28px rgba(255,45,168,.42);
  pointer-events: none;
}
.selection-kicker {
  position: relative;
  z-index: 2;
  font-size: clamp(10px, .9vw, 13px) !important;
  letter-spacing: .28em !important;
  color: #93A0CF !important;
}
.selection-title {
  position: relative;
  z-index: 2;
  margin-top: 8px !important;
  font-size: clamp(36px, 4.2vw, 60px) !important;
  line-height: 1 !important;
  letter-spacing: .055em !important;
  color: transparent !important;
  background: linear-gradient(92deg, #F5FBFF 0%, #35E0FF 43%, #B9A4FF 70%, #FF75C6 100%);
  -webkit-background-clip: text;
  background-clip: text;
  text-shadow: 0 0 34px rgba(53,224,255,.2);
}
.selection-subtitle {
  position: relative;
  z-index: 2;
  margin-top: 12px !important;
  color: #AAB6DB !important;
  font-size: clamp(14px, 1.25vw, 18px) !important;
  letter-spacing: .055em;
}
.player-grid { position: relative; z-index: 2; }
.player-card {
  color: #EAF2FF;
  transform: translateZ(0);
  will-change: transform;
  animation: cardRise .68s cubic-bezier(.16,1,.3,1) both;
}
.player-card:nth-child(2) { animation-delay: .09s; }
@keyframes cardRise {
  from { opacity: 0; transform: translateY(26px) scale(.97); }
  to { opacity: 1; transform: none; }
}
.player-card::before {
  content: "";
  position: absolute;
  inset: -35%;
  z-index: -2;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 28%, var(--accent-soft), transparent 31%),
    radial-gradient(circle at 10% 95%, var(--accent-faint), transparent 38%);
  opacity: .95;
  transition: transform .7s cubic-bezier(.2,.8,.2,1), opacity .35s ease;
}
.player-card::after {
  content: "";
  position: absolute;
  inset: -40% auto -40% -55%;
  width: 38%;
  z-index: 4;
  pointer-events: none;
  transform: translateX(-120%) rotate(12deg);
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.14), transparent);
  filter: blur(2px);
}
.player-card-grid {
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image:
    linear-gradient(var(--accent-faint) 1px, transparent 1px),
    linear-gradient(90deg, var(--accent-faint) 1px, transparent 1px),
    linear-gradient(145deg, transparent 66%, var(--accent-faint));
  background-size: 34px 34px, 34px 34px, 100% 100%;
  mask-image: linear-gradient(to bottom, rgba(0,0,0,.75), transparent 82%);
  -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.75), transparent 82%);
  opacity: .48;
}
.player-avatar-frame {
  width: clamp(174px, 16vw, 226px);
  aspect-ratio: 1;
  flex: 0 0 auto;
  display: block;
  position: relative;
  z-index: 2;
  padding: 7px;
  border: 2px solid var(--accent);
  border-radius: 50%;
  background: rgba(5,7,24,.82);
  transition: transform .5s cubic-bezier(.16,1,.3,1), box-shadow .45s ease;
}
.player-avatar-frame::before,
.player-avatar-frame::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}
.player-avatar-frame::before {
  inset: -12px;
  border: 1px solid var(--accent-soft);
  border-top-color: var(--accent);
  border-bottom-color: transparent;
  animation: haloSpin 9s linear infinite;
}
.player-avatar-frame::after {
  inset: -22px;
  border: 1px dashed var(--accent-soft);
  animation: haloSpin 15s linear infinite reverse;
  opacity: .56;
}
@keyframes haloSpin { to { transform: rotate(360deg); } }
.player-avatar { background: #090C25; }
.player-name {
  position: relative;
  z-index: 2;
  text-shadow: 0 0 18px var(--accent-soft), 0 2px 0 rgba(0,0,0,.45);
}
.player-meta {
  position: relative;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: #AAB6DB;
  font-family: 'JetBrains Mono', Consolas, monospace;
  font-size: clamp(10px, .85vw, 12px);
  font-weight: 700;
  letter-spacing: .12em;
}
.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 999px;
  animation: statusPulse 2s ease-in-out infinite;
}
@keyframes statusPulse { 50% { opacity: .48; transform: scale(.78); } }
.player-enter {
  position: relative;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
  color: var(--accent);
  font-family: 'Orbitron', sans-serif;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .15em;
  opacity: .82;
  transition: letter-spacing .32s ease, opacity .32s ease;
}
.selection-loading,
.selection-sync,
.selection-admin { position: relative; z-index: 2; }
.selection-sync {
  margin-top: 3px !important;
  color: #8F9CC9 !important;
  font-size: clamp(11px, 1vw, 13px) !important;
}
.selection-admin {
  align-self: center;
  min-width: 156px;
  border-radius: 999px !important;
  background: rgba(8,10,30,.62) !important;
  border-color: rgba(138,147,201,.36) !important;
  font-family: 'Orbitron', sans-serif;
  letter-spacing: .08em;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
@media (hover: hover) and (pointer: fine) {
  .player-card:hover {
    transform: translateY(-11px) scale(1.018);
    border-color: var(--accent) !important;
    box-shadow: 0 28px 80px rgba(0,0,0,.46), 0 0 42px var(--accent-soft), inset 0 1px 0 rgba(255,255,255,.08) !important;
    filter: saturate(1.08);
  }
  .player-card:hover::before { transform: scale(1.1) rotate(3deg); opacity: 1; }
  .player-card:hover::after { transform: translateX(500%) rotate(12deg); transition: transform .9s cubic-bezier(.16,1,.3,1); }
  .player-card:hover .player-avatar-frame { transform: translateY(-4px) scale(1.035); box-shadow: 0 0 0 1px var(--accent), 0 0 58px var(--accent-soft) !important; }
  .player-card:hover .player-avatar { transform: scale(1.035); filter: contrast(1.04) saturate(1.08); }
  .player-card:hover .player-enter { letter-spacing: .2em; opacity: 1; }
}
.player-card:active { transform: translateY(-2px) scale(.992) !important; }
.player-card:focus-visible { outline: none !important; box-shadow: 0 0 0 4px rgba(234,242,255,.92), 0 0 0 8px var(--accent), 0 24px 70px rgba(0,0,0,.5) !important; }
.player-card:disabled { cursor: wait; opacity: .62; filter: grayscale(.18); }
@media (max-width: 760px) {
  .player-select-shell { min-height: auto !important; padding: 30px 18px 24px !important; border-radius: 24px !important; }
  .selection-title { font-size: clamp(30px, 9.5vw, 44px) !important; }
  .player-grid { grid-template-columns: 1fr !important; gap: 20px !important; margin: 26px auto 18px !important; max-width: 420px !important; }
  .player-card { min-height: 360px !important; padding: 30px 22px !important; }
  .player-avatar-frame { width: min(48vw, 190px); }
}
@media (max-height: 760px) and (min-width: 761px) {
  .player-select-shell { min-height: auto !important; padding-top: 30px !important; padding-bottom: 28px !important; }
  .player-grid { margin-top: 24px !important; margin-bottom: 14px !important; }
  .player-card { min-height: 330px !important; padding-top: 24px !important; padding-bottom: 24px !important; gap: 12px !important; }
  .player-avatar-frame { width: clamp(142px, 19vh, 178px); }
  .selection-title { font-size: clamp(34px, 5.5vh, 50px) !important; }
}
@keyframes comboPop {
  0% { transform: scale(2.6) rotate(-8deg); opacity: 0; }
  55% { transform: scale(0.9) rotate(2deg); opacity: 1; }
  70% { opacity: 0.7; }
  78% { transform: scale(1.12) rotate(-1deg); opacity: 1; }
  100% { transform: scale(1) rotate(0); }
}
.combo { animation: comboPop .45s cubic-bezier(.2,1.4,.4,1); display: inline-block; }
@keyframes coinFly {
  0% { transform: translate(-50%, 0) scale(.3) rotate(0deg); opacity: 0; }
  12% { opacity: 1; }
  100% { transform: translate(calc(-50% + var(--dx)), var(--dy)) scale(1.1) rotate(var(--rot)); opacity: 0; }
}
.coin { position: absolute; left: 50%; top: 0; animation: coinFly 1.15s ease-out forwards; text-shadow: 0 0 10px rgba(255,176,32,0.8); }
@keyframes popIn2 { 0%{transform:scale(.5);opacity:0} 70%{transform:scale(1.12)} 100%{transform:scale(1);opacity:1} }
.pop2 { animation: popIn2 .4s ease-out; }
@keyframes fadeSlide { 0%{opacity:0; transform:translateY(-4px)} 100%{opacity:1; transform:none} }
.fade { animation: fadeSlide .25s ease-out; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; } .coin { display: none; } }
button:focus-visible { outline: 3px solid #35E0FF; outline-offset: 2px; }
button:not(.player-card):active { transform: translateY(1px); }
body { background: #07091A; }

/* pet idle: a slow sway with one small hop every cycle \u2014 alive, not busy */
@keyframes petIdle {
  0%   { transform: translateY(0) rotate(0) scale(1); }
  22%  { transform: translateY(-3px) rotate(-4deg) scale(1); }
  44%  { transform: translateY(0) rotate(0) scale(1); }
  66%  { transform: translateY(-3px) rotate(4deg) scale(1); }
  84%  { transform: translateY(0) rotate(0) scale(1); }
  88%  { transform: translateY(0) rotate(0) scale(1.1, .88); }
  92%  { transform: translateY(-7px) rotate(0) scale(.95, 1.08); }
  96%  { transform: translateY(0) rotate(0) scale(1.05, .95); }
  100% { transform: translateY(0) rotate(0) scale(1); }
}
.petidle { display:inline-block; transform-origin: 50% 92%; animation: petIdle 5.6s ease-in-out infinite; }
/* in-session, cold: just the sway \u2014 small and slow so it never pulls the eye off the question */
@keyframes petSway { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-2px) rotate(4deg)} }
.petsway { display:inline-block; transform-origin: 50% 92%; animation: petSway 2.8s ease-in-out infinite; }
/* in-session, hot: four charge levels, each bigger, brighter and faster than the last */
@keyframes petCharge { 0%,100%{transform:scale(1); filter:drop-shadow(0 0 2px var(--pc-a))} 50%{transform:scale(var(--pc-scale)); filter:drop-shadow(0 0 var(--pc-glow) var(--pc-b))} }
.petcharge { display:inline-block; animation: petCharge var(--pc-dur) ease-in-out infinite; }
.petcharge-1 { --pc-a:#35E0FF; --pc-b:#35E0FF; --pc-scale:1.12; --pc-glow:6px;  --pc-dur:1.05s; }
.petcharge-2 { --pc-a:#35E0FF; --pc-b:#8A5CFF; --pc-scale:1.18; --pc-glow:9px;  --pc-dur:.88s; }
.petcharge-3 { --pc-a:#8A5CFF; --pc-b:#FF2DA8; --pc-scale:1.25; --pc-glow:12px; --pc-dur:.72s; }
.petcharge-4 { --pc-a:#FF2DA8; --pc-b:#FFB020; --pc-scale:1.32; --pc-glow:16px; --pc-dur:.58s; }
@keyframes ringPulse { 0%,100%{box-shadow:0 0 4px 1px rgba(53,224,255,.5)} 50%{box-shadow:0 0 14px 4px rgba(255,45,168,.7)} }
.ringpulse { border-radius:50%; animation: ringPulse 1.8s ease-in-out infinite; }
.bgmode-bg_space { background: radial-gradient(ellipse at 50% 115%, #0A0F33 0%, #05071C 52%, #020310 100%) !important; }
.bgmode-bg_space::before, .bgmode-bg_space::after { display: none; }
.star { position: fixed; border-radius: 50%; background: #EAF2FF; z-index: -1; pointer-events: none; animation: twinkle 2.4s ease-in-out infinite; }
@keyframes twinkle { 0%,100% { opacity: .12; } 50% { opacity: .95; } }
.comet { position: fixed; width: 130px; height: 2px; border-radius: 2px; z-index: -1; pointer-events: none; opacity: 0;
  background: linear-gradient(90deg, rgba(234,242,255,0), #EAF2FF); transform: rotate(-35deg);
  animation: cometRun 10s linear infinite; }
@keyframes cometRun {
  0% { opacity: 0; transform: translate(0, 0) rotate(-35deg); }
  0.5% { opacity: 1; }
  7% { opacity: 1; transform: translate(-48vw, 34vh) rotate(-35deg); }
  7.5% { opacity: 0; transform: translate(-52vw, 37vh) rotate(-35deg); }
  100% { opacity: 0; transform: translate(-52vw, 37vh) rotate(-35deg); }
}
.bgmode-bg_symbols { background: linear-gradient(180deg, #0A0620 0%, #080A1E 60%, #05071A 100%) !important; }
.bgmode-bg_symbols::after { display: none; }
.mrain { position: fixed; top: -45%; z-index: -1; pointer-events: none; white-space: pre-line;
  font-family: 'JetBrains Mono', Consolas, monospace; line-height: 1.18; font-weight: 700;
  text-shadow: 0 0 9px currentColor; animation: mfall 6s linear infinite; }
@keyframes mfall { to { transform: translateY(170vh); } }
.bgmode-bg_city { background: linear-gradient(180deg, #150A38 0%, #1C0F44 42%, #0B0E23 100%) !important; }
.bgmode-bg_city::after { display: none; }
.cityline { position: fixed; bottom: 0; left: 0; right: 0; z-index: -1; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; gap: 5px; padding: 0 1vw; opacity: .9; }
.bld { flex: 0 0 auto; background-color: #0C1030;
  background-image: repeating-linear-gradient(0deg, rgba(255,213,128,.5) 0 2px, transparent 2px 8px),
    repeating-linear-gradient(90deg, transparent 0 4px, #0C1030 4px 8px);
  box-shadow: 0 0 26px rgba(138,92,255,.3); }
.citysign { position: fixed; width: 8px; height: 8px; border-radius: 2px; z-index: -1; pointer-events: none;
  animation: signPulse 2.6s ease-in-out infinite; }
@keyframes signPulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .star, .comet, .mrain, .citysign { animation: none; } .comet { display: none; } }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
.shake { animation: shake .3s ease; }
.hexnode { clip-path: polygon(25% 4%, 75% 4%, 99% 50%, 75% 96%, 25% 96%, 1% 50%); }
.tronbeam { position: relative; overflow: hidden; }
.tronbeam::after { content:""; position:absolute; top:0; bottom:0; left:-45%; width:38%; background:linear-gradient(90deg, transparent, rgba(255,255,255,.95), transparent); animation: beamRun 2.2s linear infinite; }
@keyframes beamRun { to { left: 115%; } }
@keyframes gatePulse { 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.12); } }
.cpdue { transform-box: fill-box; transform-origin: center; animation: gatePulse 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .cpdue { animation: none; } }

/* ---------- v1.16 shop looks ---------- */
.stale-banner { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 60; background: #FFB020; color: #1B0F2E; border: none; border-radius: 999px; padding: 8px 16px; font: 800 12px 'Orbitron', sans-serif; letter-spacing: .04em; box-shadow: 0 8px 30px rgba(0,0,0,.5); cursor: pointer; }

/* pet outfit: a small badge riding the pet's shoulder */
.petwrap { position: relative; display: inline-block; }
.petfit { position: absolute; top: -.32em; right: -.36em; font-size: .58em; line-height: 1; filter: drop-shadow(0 0 3px rgba(0,0,0,.9)); }
.petlegend { filter: drop-shadow(0 0 5px #FFB020) drop-shadow(0 0 12px rgba(255,45,168,.6)); }
.eggwrap { position: relative; display: inline-block; font-size: 24px; animation: eggRock 3.4s ease-in-out infinite; transform-origin: 50% 90%; }
.eggcount { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); font: 700 9px 'JetBrains Mono', monospace; color: #FFB020; background: #0B0E23; border: 1px solid #FFB020; border-radius: 999px; padding: 1px 5px; white-space: nowrap; }
@keyframes eggRock { 0%,100%{transform:rotate(0)} 8%{transform:rotate(-8deg)} 16%{transform:rotate(7deg)} 24%{transform:rotate(-4deg)} 30%{transform:rotate(0)} }

/* titles + name fx */
.titlechip { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px; border: 1px solid #FFB020; color: #FFB020; font-size: 9px; letter-spacing: .18em; box-shadow: 0 0 10px rgba(255,176,32,.35); vertical-align: middle; }
.namefx-rainbow, .namefx-gold { background-clip: text; -webkit-background-clip: text; color: transparent !important; -webkit-text-fill-color: transparent; }
.namefx-rainbow { background-image: linear-gradient(90deg, #FF2DA8, #FFB020, #2DFFB3, #35E0FF, #8A5CFF, #FF2DA8); background-size: 300% 100%; animation: nfxRainbow 4s linear infinite; }
@keyframes nfxRainbow { to { background-position: 300% 0; } }
.namefx-gold { background-image: linear-gradient(100deg, #B8860B 0%, #FFD54F 35%, #FFF6C8 50%, #FFD54F 65%, #B8860B 100%); background-size: 250% 100%; animation: nfxGold 3s ease-in-out infinite; }
@keyframes nfxGold { 0%,100% { background-position: 0 0; } 50% { background-position: 100% 0; } }
.namefx-glitch { animation: nfxGlitch 2.8s steps(1) infinite; }
@keyframes nfxGlitch {
  0%, 89%, 100% { text-shadow: none; transform: none; }
  90% { text-shadow: -2px 0 #35E0FF, 2px 0 #FF2DA8; transform: translateX(1px); }
  92% { text-shadow: 2px 0 #35E0FF, -2px 0 #FF2DA8; transform: translateX(-1px) skewX(-6deg); }
  94% { text-shadow: -1px 0 #35E0FF, 1px 0 #FF2DA8; transform: none; }
  96% { text-shadow: 3px 0 #35E0FF, -3px 0 #FF2DA8; transform: translateY(-1px); }
}

/* timer bar skins \u2014 the red "hurry" colour still wins under 8s (the class is dropped then) */
.tbar-tbar_bolt { background: repeating-linear-gradient(135deg, #35E0FF 0 9px, #EAF2FF 9px 13px) !important; background-size: 36px 100% !important; animation: tbarSlide .55s linear infinite; box-shadow: 0 0 12px #35E0FF; }
.tbar-tbar_lava { background: linear-gradient(90deg, #FF2D55, #FF7A2D, #FFB020, #FF7A2D, #FF2D55) !important; background-size: 200% 100% !important; animation: tbarSlow 1.6s linear infinite; box-shadow: 0 0 14px rgba(255,122,45,.8); }
.tbar-tbar_rainbow { background: linear-gradient(90deg, #FF2DA8, #FFB020, #2DFFB3, #35E0FF, #8A5CFF, #FF2DA8) !important; background-size: 300% 100% !important; animation: tbarSlow 2.4s linear infinite; box-shadow: 0 0 12px rgba(255,255,255,.35); }
.tbar-tbar_pixel { background: repeating-linear-gradient(90deg, #2DFFB3 0 10px, #0B0E23 10px 13px) !important; box-shadow: 0 0 10px rgba(45,255,179,.7); border-radius: 2px !important; }
@keyframes tbarSlide { to { background-position: 36px 0; } }
@keyframes tbarSlow { to { background-position: 200% 0; } }

/* combo shout packs */
.shout-kapow { font-family: 'Rajdhani', sans-serif !important; font-style: normal !important; transform: rotate(-4deg); letter-spacing: .04em !important; }
.shout-turbo { font-style: italic !important; letter-spacing: .2em !important; }
.shout-robot { font-family: 'JetBrains Mono', monospace !important; font-style: normal !important; text-transform: none !important; letter-spacing: .1em !important; }
.shout-dino { font-family: 'Rajdhani', sans-serif !important; font-style: normal !important; letter-spacing: .02em !important; }

/* garage: parked on the home screen, riding the map, launching on a pass */
.vehicle { position: absolute; top: 8px; right: 12px; font-size: 34px; line-height: 1; pointer-events: none; animation: vehHover 3.2s ease-in-out infinite; filter: drop-shadow(0 6px 10px rgba(53,224,255,.35)); }
.vehicle::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 24px; height: 8px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(#35E0FF, transparent 70%); animation: vehThrust .45s ease-in-out infinite alternate; }
@keyframes vehHover { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-6px) rotate(-3deg); } }
@keyframes vehThrust { from { opacity: .35; transform: translateX(-50%) scaleX(.7); } to { opacity: .9; transform: translateX(-50%) scaleX(1.2); } }
.mapveh { transform-box: fill-box; transform-origin: center; animation: mapVehBob 1.6s ease-in-out infinite; }
@keyframes mapVehBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.launch { display: inline-block; font-size: 44px; line-height: 1; animation: launchUp 1.7s cubic-bezier(.5,0,.3,1) .35s both; filter: drop-shadow(0 0 10px #35E0FF); }
@keyframes launchUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 18% { transform: translateY(5px) scale(.96); } 100% { transform: translateY(-170px) scale(1.15); opacity: 0; } }

/* base upgrade: command deck */
.base-deck { background: linear-gradient(160deg, rgba(8,14,42,.98), rgba(5,8,26,.98)) !important; border-color: rgba(53,224,255,.7) !important; box-shadow: 0 0 0 1px rgba(53,224,255,.25), 0 24px 70px rgba(0,0,0,.5), inset 0 0 70px rgba(53,224,255,.06) !important; }
.base-deck::before { content: ""; position: absolute; inset: 7px; pointer-events: none; border-radius: 12px;
  background:
    linear-gradient(#35E0FF, #35E0FF) top left / 22px 2px no-repeat, linear-gradient(#35E0FF, #35E0FF) top left / 2px 22px no-repeat,
    linear-gradient(#35E0FF, #35E0FF) top right / 22px 2px no-repeat, linear-gradient(#35E0FF, #35E0FF) top right / 2px 22px no-repeat,
    linear-gradient(#35E0FF, #35E0FF) bottom left / 22px 2px no-repeat, linear-gradient(#35E0FF, #35E0FF) bottom left / 2px 22px no-repeat,
    linear-gradient(#35E0FF, #35E0FF) bottom right / 22px 2px no-repeat, linear-gradient(#35E0FF, #35E0FF) bottom right / 2px 22px no-repeat;
  opacity: .85; filter: drop-shadow(0 0 4px #35E0FF); }
.base-deck::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; background: repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 1px, transparent 1px 4px); }
.deck-radar { position: absolute; top: 10px; left: 14px; width: 42px; height: 42px; border-radius: 50%; pointer-events: none; overflow: hidden; border: 1px solid rgba(53,224,255,.5);
  background: radial-gradient(circle, transparent 58%, rgba(53,224,255,.16) 59%, transparent 61%), radial-gradient(circle, transparent 30%, rgba(53,224,255,.16) 31%, transparent 33%), rgba(53,224,255,.05); }
.deck-radar::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, rgba(53,224,255,.6), transparent 30%); animation: spinRing 2.6s linear infinite; }
.deck-radar::after { content: ""; position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #2DFFB3; top: 13px; left: 26px; box-shadow: 0 0 6px #2DFFB3; animation: blip 2.6s ease-in-out infinite; }
.deck-ticker { position: relative; z-index: 1; font: 700 9.5px 'JetBrains Mono', monospace; letter-spacing: .2em; color: #35E0FF; opacity: .9; margin: 0 0 8px; text-align: center; }
.deck-ticker b { animation: blink 1.1s steps(1) infinite; }
@keyframes spinRing { to { transform: rotate(360deg); } }
@keyframes blip { 0%,60%,100% { opacity: .15; } 70% { opacity: 1; } }
@keyframes blink { 50% { opacity: .2; } }

/* prestige frame: spinning rainbow ring + an orbiting spark; --orb is the orbit radius per size */
.ringprestige { position: relative; border-radius: 50%; isolation: isolate; }
.ringprestige::before { content: ""; position: absolute; inset: -5px; border-radius: 50%; z-index: -1; background: conic-gradient(from 0deg, #35E0FF, #8A5CFF, #FF2DA8, #FFB020, #2DFFB3, #35E0FF); animation: spinRing 3s linear infinite; box-shadow: 0 0 18px rgba(138,92,255,.65); }
.ringprestige::after { content: "\u2726"; position: absolute; left: 50%; top: 50%; margin: -6px 0 0 -5px; font-size: 10px; line-height: 1; color: #fff; text-shadow: 0 0 6px #fff, 0 0 12px #35E0FF; animation: orbit 2.2s linear infinite; }

.frame-prestige { position: absolute; inset: -12px; border-radius: 50%; z-index: -1; background: conic-gradient(from 0deg, #35E0FF, #8A5CFF, #FF2DA8, #FFB020, #2DFFB3, #35E0FF); animation: spinRing 3.5s linear infinite; box-shadow: 0 0 40px rgba(138,92,255,.7); }
.player-avatar-frame { isolation: isolate; }

/* surprise box reveal */
.crate-reveal { display: inline-flex; align-items: center; gap: 12px; margin: 0 auto 12px; padding: 10px 18px; border: 1.5px solid #FFB020; border-radius: 14px; background: #0B0E23; box-shadow: 0 0 22px rgba(255,176,32,.35); animation: fadeSlide .3s ease-out; }

.crate-name { font: 800 14px 'Orbitron', sans-serif; color: #FFB020; opacity: 0; animation: fadeSlide .3s ease-out 1.1s forwards; }
@keyframes crateShake { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-14deg); } 40% { transform: rotate(12deg); } 60% { transform: rotate(-10deg); } 80% { transform: rotate(8deg); } }
@keyframes cratePop { from { transform: scale(.2); opacity: 0; } 70% { transform: scale(1.3); opacity: 1; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .crate-item, .crate-name { opacity: 1; } }
/* add-player + guide */
.add-player { position: relative; z-index: 2; margin: 6px auto 4px; padding: 10px 20px; border-radius: 999px; background: rgba(8,10,30,.62); border: 1.5px dashed rgba(138,147,201,.55); color: #EAF2FF; font: 700 13px 'Orbitron', sans-serif; letter-spacing: .08em; cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.add-player:hover { border-style: solid; border-color: #2DFFB3; color: #2DFFB3; box-shadow: 0 0 18px rgba(45,255,179,.35); }
.pick { cursor: pointer; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
.pick:active { transform: scale(.9) !important; }

.choicebtn:active { transform: scale(.96) !important; background: #2A1F3F; }
.tts { border: 1.5px solid #FFB020; background: #0B0E23; color: #FFB020; border-radius: 999px; width: 30px; height: 30px; font-size: 15px; line-height: 1; cursor: pointer; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
.track-active { outline: 0; }
