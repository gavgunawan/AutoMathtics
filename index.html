<script id="cyberpunk-ui-hooks">
(() => {
  const root = document.getElementById('root');
  if (!root) return;

  let queued = false;
  const queueDecorate = () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => {
      queued = false;
      decorate();
    });
  };

  const directImage = button => {
    for (const child of button.children) {
      if (child.tagName === 'IMG') return child;
    }
    return null;
  };

  const decorate = () => {
    root.querySelectorAll('button').forEach(button => button.classList.add('cyber-action'));
    root.querySelectorAll('h1').forEach(title => title.classList.add('cyber-title'));
    root.querySelectorAll('header').forEach(header => header.classList.add('app-header'));

    root.querySelectorAll('div').forEach(element => {
      const style = element.style;
      if (style.maxWidth === '640px' && style.width === '100%' && style.textAlign === 'center') {
        element.classList.add('cyber-panel');
      }
    });

    const selectionTitle = [...root.querySelectorAll('h1')]
      .find(element => element.textContent.trim() === 'PLAYER SELECTION');

    document.body.classList.toggle('screen-player-selection', Boolean(selectionTitle));
    if (!selectionTitle) return;

    const panel = selectionTitle.parentElement;
    if (!panel) return;

    panel.classList.add('cyber-panel', 'player-select-panel');
    selectionTitle.classList.add('player-select-title');

    const directChildren = [...panel.children];
    if (directChildren[0]) directChildren[0].classList.add('selection-kicker');
    if (directChildren[2]) directChildren[2].classList.add('selection-subtitle');

    const playerButtons = [...panel.querySelectorAll('button')]
      .filter(button => directImage(button));

    if (playerButtons.length) {
      const row = playerButtons[0].parentElement;
      if (row) row.classList.add('player-row');
    }

    playerButtons.forEach((button, index) => {
      button.classList.add('player-card');
      button.dataset.playerSlot = String(index + 1).padStart(2, '0');

      const accent = button.style.borderColor || getComputedStyle(button).borderTopColor || '#35e0ff';
      button.style.setProperty('--accent', accent);

      const image = directImage(button);
      if (image) image.classList.add('player-avatar');

      [...button.children]
        .filter(child => child.tagName === 'SPAN')
        .forEach(span => span.classList.add('player-name'));
    });

    directChildren.forEach(element => {
      const text = element.textContent.trim().toLowerCase();
      if (text.includes('cloud sync') || text.includes('local-only')) {
        element.classList.add('selection-status');
      }
      if (element.tagName === 'BUTTON' && text.includes('admin')) {
        element.classList.add('admin-launch');
      }
    });
  };

  new MutationObserver(queueDecorate).observe(root, { childList: true, subtree: true });
  window.addEventListener('resize', queueDecorate, { passive: true });
  decorate();
})();
</script>
